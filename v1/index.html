<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ed957">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="farty">
<meta name="format-detection" content="telephone=no">
<!-- Fully offline single file: no network requests allowed or needed (works from file:// on a phone) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:">
<title>farty</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥦</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#bdf0ff;font-family:"Trebuchet MS",system-ui,sans-serif;color:#2b2b40;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;pointer-events:none;font-weight:bold;font-size:19px;z-index:2}
  .pill{background:rgba(255,255,255,.88);border-radius:20px;padding:4px 10px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
  #mood{font-size:22px;padding:2px 8px;transition:transform .2s}
  #mute{pointer-events:auto;border:none;background:rgba(255,255,255,.88);border-radius:50%;width:38px;height:38px;font-size:19px;box-shadow:0 2px 0 rgba(0,0,0,.12);cursor:pointer;flex:none}
  #bars{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 56px);width:min(96vw,470px);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:rgba(255,255,255,.88);border-radius:14px;padding:5px 8px 7px;box-shadow:0 2px 0 rgba(0,0,0,.12);pointer-events:none;z-index:2}
  .b{display:flex;flex-direction:column;align-items:center;position:relative}
  .b i{font-style:normal;font-size:20px;line-height:1.1}
  .t{width:100%;height:10px;background:#e3e3ea;border-radius:6px;overflow:hidden;margin-top:2px}
  .f{height:100%;width:50%;border-radius:6px;transition:width .35s cubic-bezier(.3,1.6,.5,1)}
  .b.bad .t{outline:2px dashed rgba(229,57,53,.45);outline-offset:1px}
  .b.up i{animation:pop .45s}.b.down i{animation:shake .4s}
  .b.low .f,.b.high .f{animation:blink .7s infinite}
  .arw{position:absolute;top:-4px;right:-4px;font-size:14px;opacity:0}
  .arw.go{animation:arw 1s ease-out}
  #bars.balanced{box-shadow:0 0 0 3px #ffd54f,0 2px 0 rgba(0,0,0,.12)}
  @keyframes pop{40%{transform:scale(1.6)}}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  @keyframes blink{50%{opacity:.3}}
  @keyframes arw{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  #fb{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 112px);transform:translateX(-50%) scale(.8);background:#fff;border-radius:18px;padding:6px 14px;font-size:28px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.12);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:2}
  #fb.show{opacity:1;transform:translateX(-50%) scale(1)}
  #fb.good{border:3px solid #4caf50}#fb.bad{border:3px solid #ff7043}
  #fb small{font-size:20px}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:linear-gradient(#bdf0ff,#e9ffd9);z-index:5;overflow-y:auto}
  .screen.hidden{display:none}
  h1{font-size:60px;margin:0;color:#4caf50;text-shadow:3px 3px 0 #2e7d32;letter-spacing:2px}
  .big{font-size:min(70px,9vh);line-height:1;margin:6px 0;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .legend{display:flex;flex-direction:column;gap:8px;margin:10px 0;width:min(92vw,360px)}
  .legend div{background:#fff;border-radius:16px;padding:6px 10px;font-size:clamp(20px,7vw,28px);box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
  button.go{margin-top:14px;font-size:44px;line-height:1;border:none;border-radius:50px;padding:14px 46px;background:#4caf50;box-shadow:0 6px 0 #2e7d32;cursor:pointer}
  button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #2e7d32}
  .scores{font-size:30px;font-weight:bold;margin:4px 0}
  .new{display:inline-block;animation:bob 1s infinite}
  .recap{background:#fff;border-radius:16px;padding:8px 12px;margin:6px 0;width:min(92vw,420px);font-size:30px;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.1);word-wrap:break-word}
  .recap.good{border:3px solid #4caf50}.recap.bad{border:3px solid #ff7043}
  #rres{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);background:#fff;border-radius:26px;padding:14px 26px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.15);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.7,.5,1);pointer-events:none;z-index:4}
  #rres.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #rres .rf{font-size:80px;line-height:1.1}
  #rres .rs{font-size:40px;letter-spacing:4px}
  #rres .rr{font-size:26px;font-weight:bold;color:#2e7d32}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" style="display:none">
  <div class="pill" id="score">⭐0</div>
  <div class="pill" id="round">🏁1</div>
  <div class="pill" id="mood">🙂</div>
  <div class="pill" id="lives">❤️❤️❤️</div>
  <button id="mute" aria-label="geluid">🔊</button>
</div>
<div id="bars" style="display:none"></div>
<div id="fb"></div>
<div id="rres"></div>

<div class="screen" id="start">
  <h1>farty</h1>
  <div class="big">😋</div>
  <div class="legend">
    <div>👆 ⬅️➡️</div>
    <div>🍎🥕🐟🥚 → ⭐</div>
    <div>🍩🥤🍟🍬 → 💔</div>
    <div>🫘🥦🍐 → 💨 ⭐×2</div>
    <div>🥩🍞🧈🍊💧 ⬆️ → 😄</div>
    <div>🧂 ⬆️ → 🤢</div>
  </div>
  <button class="go" id="playBtn" aria-label="start">▶️</button>
  <p class="scores" id="bestStart"></p>
</div>

<div class="screen hidden" id="over">
  <div class="big" id="overFace">😮‍💨</div>
  <p class="scores" id="finalScore"></p>
  <p class="scores" id="bestScore"></p>
  <div class="recap good" id="recapGood"></div>
  <div class="recap bad" id="recapBad"></div>
  <button class="go" id="againBtn" aria-label="opnieuw">🔁</button>
</div>

<script>
(() => {
"use strict";
// Nutrient bars: pro=eiwitten, carb=koolhydraten, fat=vetten, vit=vitaminen, wat=water, salt=zout (bad when high)
const NUTS=[
  {k:"pro",i:"🥩",n:"eiwitten",c:"#ab47bc"},
  {k:"carb",i:"🍞",n:"koolhydraten",c:"#ffb300"},
  {k:"fat",i:"🧈",n:"vetten",c:"#fdd835"},
  {k:"vit",i:"🍊",n:"vitaminen",c:"#ff7043"},
  {k:"wat",i:"💧",n:"water",c:"#29b6f6"},
  {k:"salt",i:"🧂",n:"zout",c:"#e53935",bad:true},
];
// Healthy foods: what they add (roughly true to their main nutrients)
const GOOD=[
  {e:"🥕",nu:{vit:18,carb:4,wat:4}},
  {e:"🥦",nu:{vit:16,pro:4,carb:4},toot:true},
  {e:"🫘",nu:{pro:14,carb:12},toot:true},
  {e:"🍎",nu:{carb:10,vit:6,wat:6}},
  {e:"🍌",nu:{carb:16,vit:6}},
  {e:"🍓",nu:{vit:18,wat:6}},
  {e:"🫐",nu:{vit:14,carb:4}},
  {e:"🍊",nu:{vit:20,wat:8}},
  {e:"🥬",nu:{vit:18,wat:4}},
  {e:"🍠",nu:{carb:16,vit:14}},
  {e:"🐟",nu:{pro:20,fat:10}},
  {e:"🥜",nu:{fat:16,pro:10}},
  {e:"🥚",nu:{pro:18,fat:8}},
  {e:"💧",nu:{wat:26}},
  {e:"🥣",nu:{carb:18,pro:4}},
  {e:"🍉",nu:{wat:20,vit:6}},
  {e:"🥑",nu:{fat:16,vit:6}},
  {e:"🥛",nu:{pro:10,wat:10,fat:4}},
  {e:"🍐",nu:{carb:10,vit:4,wat:6},toot:true},
];
// Treats: raise salt (salty ones) and push out the good stuff
const BAD=[
  {e:"🍬",nu:{vit:-8,pro:-6,wat:-4}},
  {e:"🥤",nu:{vit:-8,pro:-6,wat:-4}},
  {e:"🍟",nu:{salt:22,vit:-6,wat:-6}},
  {e:"🍩",nu:{vit:-8,pro:-6,wat:-4}},
  {e:"🍭",nu:{vit:-8,pro:-6,wat:-4}},
  {e:"🧁",nu:{vit:-8,pro:-6,wat:-4}},
  {e:"🌭",nu:{salt:24,vit:-6,wat:-6}},
  {e:"🍪",nu:{vit:-8,pro:-6,wat:-4}},
  {e:"🥨",nu:{salt:20,vit:-4,wat:-6}},
];
const NI = Object.fromEntries(NUTS.map(x=>[x.k,x.i]));

const cv=document.getElementById("game"), cx=cv.getContext("2d"), $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2.5); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0);
  if (player){ player.y=H-Math.max(70,H*0.12); player.x=Math.min(Math.max(player.x,30),W-30); } }
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

// ---------- Audio ----------
let ac=null, muted=store.get("farty_muted","0")==="1";
function initAudio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}} if(ac&&ac.state==="suspended")ac.resume(); }
function tone(fq,dur,type="sine",vol=0.15,to=null,delay=0){ if(muted||!ac)return; const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(fq,t); if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02); }
const sfx={
  good(){ tone(660,0.09,"triangle",0.15); tone(990,0.12,"triangle",0.13,null,0.07); },
  bad(){ tone(200,0.3,"square",0.08,90); },
  toot(){ if(muted||!ac)return; const t=ac.currentTime,d=0.55,o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter();
    o.type="sawtooth"; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(70,t+d); l.frequency.value=28; lg.gain.value=30; l.connect(lg).connect(o.frequency);
    f.type="lowpass"; f.frequency.value=700; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(f).connect(g).connect(ac.destination); o.start(t); l.start(t); o.stop(t+d+0.05); l.stop(t+d+0.05); tone(1200,0.15,"sine",0.06,1800,d); },
  bigFart(){ if(muted||!ac)return; const t=ac.currentTime,d=1.4;
    const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter();
    o.type="sawtooth"; o2.type="square"; o.frequency.setValueAtTime(110,t); o.frequency.linearRampToValueAtTime(150,t+0.35); o.frequency.exponentialRampToValueAtTime(55,t+d);
    o2.frequency.setValueAtTime(57,t); o2.frequency.exponentialRampToValueAtTime(40,t+d);
    l.type="sine"; l.frequency.setValueAtTime(22,t); l.frequency.linearRampToValueAtTime(35,t+d); lg.gain.value=40; l.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    f.type="lowpass"; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(300,t+d); f.Q.value=4;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.05); g.gain.setValueAtTime(0.45,t+d*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(f); o2.connect(f); f.connect(g).connect(ac.destination);
    // breathy noise layer
    const nb=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate), ch=nb.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
    const ns=ac.createBufferSource(), nf=ac.createBiquadFilter(), ng=ac.createGain(); ns.buffer=nb; nf.type="bandpass"; nf.frequency.value=400; ng.gain.setValueAtTime(0.12,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+d);
    ns.connect(nf).connect(ng).connect(ac.destination);
    [o,o2,l,ns].forEach(n=>{n.start(t); n.stop(t+d+0.05);}); tone(1500,0.25,"sine",0.07,2400,d+0.05); },
  round(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.12,"triangle",0.12,null,i*0.08)); },
  over(){ [523,440,349,262].forEach((f,i)=>tone(f,0.22,"triangle",0.14,null,i*0.16)); },
  start(){ [392,523,659].forEach((f,i)=>tone(f,0.12,"triangle",0.13,null,i*0.08)); },
};
function setMuteIcon(){ $("mute").textContent=muted?"🔇":"🔊"; }
$("mute").addEventListener("pointerdown",e=>{e.stopPropagation();muted=!muted;store.set("farty_muted",muted?"1":"0");setMuteIcon();initAudio();});
setMuteIcon();

// ---------- Bars ----------
const nut={}, barEl={};
$("bars").innerHTML=NUTS.map(x=>`<div class="b${x.bad?" bad":""}" id="nb_${x.k}" title="${x.n}" aria-label="${x.n}"><i>${x.i}</i><div class="t"><div class="f" style="background:${x.c}"></div></div><span class="arw"></span></div>`).join("");
NUTS.forEach(x=>{const b=$("nb_"+x.k); barEl[x.k]={box:b,fill:b.querySelector(".f"),arw:b.querySelector(".arw")};});
function resetNut(){ NUTS.forEach(x=>nut[x.k]=x.bad?0:50); renderBars(); }
function arrow(k,up){ const e=barEl[k]; e.box.classList.remove("up","down"); e.arw.classList.remove("go"); void e.box.offsetWidth;
  e.box.classList.add(up?"up":"down"); e.arw.textContent=up?"⬆️":"⬇️"; e.arw.classList.add("go"); }
const isBalanced=()=>NUTS.every(x=>x.bad?nut[x.k]<40:nut[x.k]>=50);
function goodAvg(){ const g=NUTS.filter(x=>!x.bad); return g.reduce((s,x)=>s+nut[x.k],0)/g.length; }
function mood(){ const a=goodAvg(), s=nut.salt; if (s>=65||a<20) return "sick"; if (a>=50&&s<40) return "healthy"; return "ok"; }
function renderBars(){ NUTS.forEach(x=>{const v=nut[x.k]; barEl[x.k].fill.style.width=v.toFixed(1)+"%"; barEl[x.k].box.classList.toggle("low",!x.bad&&v<15); barEl[x.k].box.classList.toggle("high",!!x.bad&&v>=65);});
  $("bars").classList.toggle("balanced",isBalanced()); const m=mood(); const ic={sick:"🤢",ok:"🙂",healthy:"😄"}[m];
  if ($("mood").textContent!==ic){ $("mood").textContent=ic; $("mood").style.transform="scale(1.4)"; setTimeout(()=>$("mood").style.transform="",200); } }
function feedNut(item){ for(const k in item.nu){ const d=item.nu[k]; nut[k]=Math.max(0,Math.min(100,nut[k]+d)); arrow(k,d>0);} renderBars(); }
let barTick=0;
function drainNut(dt){ const r=1.2+Math.min(elapsed,120)*0.012; NUTS.forEach(x=>{ nut[x.k]=Math.max(0,nut[x.k]-(x.bad?r*0.8:r)*dt); }); barTick+=dt; if(barTick>0.2){barTick=0;renderBars();} }

// ---------- State ----------
let player=null,foods=[],parts=[],floaters=[],clouds=[];
let state="start",score=0,lives=3,elapsed=0,spawnT=0,tootT=0,combo=0,round=1,best=+store.get("farty_best","0")||0;
let caughtGood=[],caughtBad=[],targetX=null,keys={},last=0,shake=0;
const MAX_LIVES=3, ROUND_LEN=+(new URLSearchParams(location.search).get('rl'))||25;
let phase="run",phaseT=0,rs={t:0,m:0,b:0};
function reset(){ player={x:W/2,y:H-Math.max(70,H*0.12),r:Math.max(30,Math.min(W,H)*0.075),mouth:0,squish:0,sad:0};
  foods=[];parts=[];floaters=[];score=0;lives=MAX_LIVES;elapsed=0;spawnT=0.6;tootT=0;combo=0;round=1;caughtGood=[];caughtBad=[];targetX=null; phase="run";phaseT=0;rs={t:0,m:0,b:0}; $("rres").classList.remove("show"); resetNut(); updateHud(); }
for(let i=0;i<5;i++)clouds.push({x:Math.random(),y:0.15+Math.random()*0.5,s:0.6+Math.random()*0.8,v:0.005+Math.random()*0.01});
function updateHud(){ $("score").textContent="⭐"+score+(tootT>0?" 💨×2":""); $("round").textContent="🏁"+round;
  $("lives").textContent="❤️".repeat(lives)+"🤍".repeat(Math.max(0,MAX_LIVES-lives)); }
const fallSpeed=()=>H*0.22+elapsed*H*0.006;
const spawnEvery=()=>Math.max(0.38,1.05-elapsed*0.008);
const badChance=()=>Math.min(0.45,0.25+elapsed*0.003);
function spawn(){ const bad=Math.random()<badChance(); let item;
  if(bad) item=BAD[(Math.random()*BAD.length)|0]; else { const pool=Math.random()<0.2?GOOD.filter(g=>g.toot):GOOD; item=pool[(Math.random()*pool.length)|0]; }
  const size=Math.max(38,Math.min(W,H)*0.1);
  foods.push({item,bad,x:size/2+Math.random()*(W-size),y:-size,size,vy:fallSpeed()*(0.85+Math.random()*0.3),rot:(Math.random()-.5)*0.6,vr:(Math.random()-.5)*2}); }

// ---------- Icon feedback (no text) ----------
let fbTimer=null;
function showFb(item,bad,extra){ const el=$("fb"); el.className=bad?"bad":"good";
  const parts=Object.entries(item.nu).map(([k,d])=>`${NI[k]}<small>${d>0?"⬆️":"⬇️"}</small>`).join(" ");
  el.innerHTML=`${item.e} → ${parts}${extra?" "+extra:""}`; void el.offsetWidth; el.classList.add("show");
  clearTimeout(fbTimer); fbTimer=setTimeout(()=>el.classList.remove("show"),1600); }
function burst(x,y,cols,n=12,spd=180){ for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(0.4+Math.random()); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0.6+Math.random()*0.3,max:0.9,c:cols[i%cols.length],r:3+Math.random()*4});} }
function floater(text,x,y,color,size=26){ floaters.push({text,x,y,color,size,life:1}); }
function toot(){ tootT=5; sfx.toot(); shake=0.25;
  for(let i=0;i<14;i++)parts.push({x:player.x+(Math.random()-.5)*player.r,y:player.y+player.r*0.8,vx:(Math.random()-.5)*160,vy:40+Math.random()*80,life:1+Math.random()*0.6,max:1.6,c:"rgba(160,220,90,0.55)",r:10+Math.random()*14,cloud:true});
  floater("💨💨", player.x, player.y-player.r*1.6, "#5a9e1f", 40); }
function catchFood(f){
  feedNut(f.item);
  if(f.bad){ caughtBad.push(f.item.e); lives--; combo=0; sfx.bad(); shake=0.3; player.sad=1; showFb(f.item,true,"💔");
    burst(f.x,f.y,["#ff7043","#ffb199","#ffd54f"],10); floater("💔",f.x,f.y,"#d84315",34);
    if(lives<=0){ updateHud(); gameOver(); return; } }
  else { caughtGood.push(f.item.e); combo++; const bal=isBalanced(); const pts=10*(tootT>0||f.item.toot?2:1)+Math.min(combo,10)+(bal?5:0);
    score+=pts; sfx.good(); player.mouth=1; showFb(f.item,false,f.item.toot?"💨":(bal?"✨":""));
    burst(f.x,f.y,["#66bb6a","#ffee58","#ffffff","#81d4fa"],12); floater("+"+pts+(bal?"✨":""),f.x,f.y,"#2e7d32");
    if(f.item.toot) toot(); }
  player.squish=1; updateHud(); }

// ---------- End-of-round BIG fart ----------
const FART_LEN=1.7, RES_LEN=2.0;
function startBigFart(){ phase="fart"; phaseT=0; sfx.bigFart(); shake=1.2; $("fb").classList.remove("show");
  for(let i=0;i<40;i++) parts.push({x:player.x+(Math.random()-.5)*player.r*1.5,y:player.y+player.r*0.6,vx:(Math.random()-.5)*520,vy:-Math.random()*380,life:1.4+Math.random()*0.8,max:2.2,c:i%3?"rgba(150,215,80,0.55)":"rgba(200,240,120,0.6)",r:16+Math.random()*24,cloud:true}); }
function drawBigFart(){ const k=Math.min(1,phaseT/0.5), r=player.r;
  cx.save(); cx.globalAlpha=Math.max(0,1-Math.max(0,phaseT-1.1)/0.6);
  cx.fillStyle="rgba(150,215,80,0.45)"; cx.beginPath(); cx.arc(player.x,player.y,r*(1.5+k*4.5),0,7); cx.fill();
  cx.font=`${r*(1.2+k*3.2)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; cx.textAlign="center"; cx.textBaseline="middle";
  cx.fillText("💨", player.x+r*1.4*k*(player.x<W/2?1:-1), player.y-r*(0.4+1.6*k)); cx.restore(); }
function roundEndUpdate(dt){ phaseT+=dt;
  if(phase==="fart"){ const w=Math.sin(phaseT*28)*Math.max(0,1-phaseT/FART_LEN); player.squish=0.4+w*0.6; player.mouth=1;
    if(Math.random()<dt*25) parts.push({x:player.x+(Math.random()-.5)*player.r,y:player.y+player.r*0.7,vx:(Math.random()-.5)*300,vy:-Math.random()*200,life:1.2,max:1.2,c:"rgba(160,220,90,0.5)",r:14+Math.random()*16,cloud:true});
    if(phaseT>=FART_LEN){ phase="result"; phaseT=0; showRoundResult(); } }
  else if(phase==="result" && phaseT>=RES_LEN){ $("rres").classList.remove("show"); round++; updateHud(); sfx.round(); floater("🏁"+round,W/2,H*0.45,"#2e7d32",64);
    rs={t:0,m:0,b:0}; phase="run"; phaseT=0; } }
function showRoundResult(){ const avg=rs.t?rs.m/rs.t:1, bal=rs.t?rs.b/rs.t:0;   // avg mood 0..2, share of time balanced 0..1
  const q=avg/2*0.6+bal*0.4; const stars=q>=0.7?3:q>=0.45?2:q>=0.2?1:0;
  const face=avg>=1.4?"😄":avg>=0.7?"🙂":"🤢"; const bonus=stars*20; score+=bonus; updateHud();
  $("rres").innerHTML=`<div class="rr">🏁${round}</div><div class="rf">${face}</div><div class="rs">${"⭐".repeat(stars)}${"<span style='opacity:.25'>⭐</span>".repeat(3-stars)}</div>${bonus?`<div class="rr">+${bonus}</div>`:""}`;
  $("rres").classList.add("show"); }

// ---------- Input ----------
cv.addEventListener("pointerdown",e=>{ if(state==="play") targetX=e.clientX; });
cv.addEventListener("pointermove",e=>{ if(state==="play") targetX=e.clientX; });
addEventListener("keydown",e=>{ keys[e.key]=true; if((e.key===" "||e.key==="Enter")&&state!=="play") startGame(); });
addEventListener("keyup",e=>{ keys[e.key]=false; });
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&state==="play") state="paused"; else if(!document.hidden&&state==="paused"){ state="play"; last=performance.now(); } });
document.addEventListener("gesturestart",e=>e.preventDefault());

// ---------- Screens ----------
function showBestStart(){ $("bestStart").textContent=best>0?"🏆 "+best:""; }
function startGame(){ initAudio(); sfx.start(); reset(); $("start").classList.add("hidden"); $("over").classList.add("hidden");
  $("hud").style.display="flex"; $("bars").style.display="grid"; state="play"; last=performance.now(); }
const uniq=a=>[...new Set(a)].join("");
function gameOver(){ state="over"; sfx.over(); let isNew=false; if(score>best){best=score;store.set("farty_best",String(best));isNew=score>0;}
  $("finalScore").textContent="⭐ "+score+"   🏁 "+round;
  $("bestScore").innerHTML=isNew?'<span class="new">🏆 '+best+' 🆕🎉</span>':"🏆 "+best;
  $("overFace").textContent=score>=300?"🤩":score>=100?"😋":"😮‍💨";
  $("recapGood").textContent="👍 "+(uniq(caughtGood)||"—"); $("recapBad").textContent="👎 "+(uniq(caughtBad)||"—");
  setTimeout(()=>{ $("hud").style.display="none"; $("bars").style.display="none"; $("fb").classList.remove("show"); $("over").classList.remove("hidden"); },650); }
$("playBtn").addEventListener("click",startGame); $("againBtn").addEventListener("click",startGame);

// ---------- Drawing ----------
function drawBg(dt){ const g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#bdf0ff"); g.addColorStop(1,"#eaffd6"); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  cx.fillStyle="rgba(255,255,255,0.8)";
  for(const c of clouds){ c.x+=c.v*dt; if(c.x>1.2)c.x=-0.2; const x=c.x*W,y=c.y*H,s=c.s*40; cx.beginPath(); cx.arc(x,y,s,0,7); cx.arc(x+s*0.9,y+s*0.2,s*0.75,0,7); cx.arc(x-s*0.9,y+s*0.25,s*0.65,0,7); cx.fill(); }
  const gy=H-Math.max(70,H*0.12)+(player?player.r*0.85:30); cx.fillStyle="#7ed957"; cx.fillRect(0,gy,W,H-gy);
  cx.fillStyle="#5fbf3a"; for(let x=0;x<W;x+=22){cx.beginPath();cx.moveTo(x,gy);cx.lineTo(x+11,gy-9);cx.lineTo(x+22,gy);cx.fill();} }
function drawPlayer(t){ const p=player,r=p.r,sq=p.squish*0.18,m=state==="play"?mood():"ok";
  cx.save(); cx.translate(p.x,p.y);
  if(tootT>0||m==="healthy"){ cx.shadowColor=tootT>0?"rgba(140,220,60,0.9)":"rgba(255,215,64,0.9)"; cx.shadowBlur=22; }
  cx.scale(1+sq,1-sq);
  cx.fillStyle=p.sad>0.3?"#ffb74d":m==="sick"?"#c5d86d":m==="healthy"?"#7ddc55":"#8fe36a";
  cx.beginPath(); cx.ellipse(0,0,r*1.05,r,0,0,Math.PI*2); cx.fill(); cx.shadowBlur=0;
  cx.fillStyle="rgba(255,255,255,0.35)"; cx.beginPath(); cx.ellipse(-r*0.4,-r*0.45,r*0.35,r*0.2,-0.5,0,7); cx.fill();
  cx.fillStyle=m==="sick"?"#9e9d24":"#4caf50"; const droop=m==="sick"?0.9:0;
  cx.beginPath(); cx.ellipse(r*0.15+droop*r*0.2,-r*1.1+droop*r*0.1,r*0.18,r*0.38,0.6+droop,0,7); cx.fill();
  cx.beginPath(); cx.ellipse(-r*0.15,-r*1.05,r*0.14,r*0.3,-0.6,0,7); cx.fill();
  const blink=(Math.sin(t*0.0013)>0.985)?0.15:1; cx.fillStyle="#2b2b40";
  if(m==="sick"){ cx.strokeStyle="#2b2b40"; cx.lineWidth=r*0.06; for(const s of [-1,1]){ cx.beginPath(); cx.moveTo(s*r*0.47,-r*0.22); cx.lineTo(s*r*0.25,-r*0.1); cx.stroke(); } }
  else { for(const s of [-1,1]){cx.beginPath();cx.ellipse(s*r*0.35,-r*0.15,r*0.12,r*0.16*blink,0,0,7);cx.fill();}
    cx.fillStyle="#fff"; for(const s of [-1,1]){cx.beginPath();cx.arc(s*r*0.35+r*0.04,-r*0.22,r*0.04,0,7);cx.fill();} }
  if(m!=="sick"){ cx.fillStyle="rgba(255,120,150,0.5)"; for(const s of [-1,1]){cx.beginPath();cx.ellipse(s*r*0.62,r*0.12,r*0.13,r*0.08,0,0,7);cx.fill();} }
  cx.fillStyle="#7a2c3a"; cx.strokeStyle="#7a2c3a"; cx.lineWidth=r*0.07;
  if(p.sad>0.3){ cx.beginPath(); cx.arc(0,r*0.45,r*0.22,Math.PI*1.15,Math.PI*1.85); cx.stroke(); }
  else if(m==="sick"){ cx.beginPath(); for(let i=0;i<=8;i++){ const x=-r*0.28+i*r*0.07, y=r*0.35+(i%2?-1:1)*r*0.05; i?cx.lineTo(x,y):cx.moveTo(x,y);} cx.stroke(); }
  else { const mo=0.12+p.mouth*0.18+(m==="healthy"?0.05:0); cx.beginPath(); cx.ellipse(0,r*0.3,r*0.25,r*mo,0,0,Math.PI); cx.fill(); }
  cx.restore();
  // state icon above head
  if(state==="play"&&(m!=="ok")){ cx.font=`${r*0.7}px sans-serif`; cx.textAlign="center"; cx.textBaseline="middle";
    cx.fillText(m==="sick"?"🤢":"✨", p.x+r*0.95, p.y-r*1.05+Math.sin(t*0.005)*3); } }
function drawFood(f){ cx.save(); cx.translate(f.x,f.y); cx.rotate(f.rot); cx.font=`${f.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText(f.item.e,0,0); cx.restore(); }

// ---------- Loop ----------
function step(now){ requestAnimationFrame(step); let dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state!=="play"){ drawBg(dt||0.016); if(player) drawPlayer(now); return; }
  const m=mood(), mv=m==="sick"?6:14; // sick Farty moves sluggishly
  if(phase==="run"){
    elapsed+=dt; drainNut(dt);
    rs.t+=dt; rs.m+=({healthy:2,ok:1,sick:0})[m]*dt; if(isBalanced()) rs.b+=dt;
    if(elapsed>=round*ROUND_LEN) startBigFart();
  } else roundEndUpdate(dt);
  const spd=W*1.6; if(keys.ArrowLeft||keys.a) targetX=player.x-spd*dt*1.5; if(keys.ArrowRight||keys.d) targetX=player.x+spd*dt*1.5;
  if(phase!=="run") targetX=null;
  if(targetX!==null){ player.x+=(targetX-player.x)*Math.min(1,dt*mv); }
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.squish=Math.max(0,player.squish-dt*5); player.mouth=Math.max(0,player.mouth-dt*3); player.sad=Math.max(0,player.sad-dt*1.5);
  if(tootT>0){ tootT-=dt; if(tootT<=0){tootT=0;updateHud();}
    if(Math.random()<dt*6) parts.push({x:player.x+(Math.random()-.5)*player.r,y:player.y+player.r*0.7,vx:(Math.random()-.5)*40,vy:30,life:0.8,max:0.8,c:"rgba(160,220,90,0.4)",r:8+Math.random()*8,cloud:true}); }
  const run=phase==="run";
  if(run){ spawnT-=dt; } if(run&&spawnT<=0){ spawn(); spawnT=spawnEvery()*(0.8+Math.random()*0.4); }
  for(let i=foods.length-1;i>=0;i--){ const f=foods[i]; if(!run){ continue; } f.y+=f.vy*dt; f.rot+=f.vr*dt*0.3;
    if(Math.hypot(f.x-player.x,f.y-(player.y-player.r*0.2))<player.r*0.95+f.size*0.35){ foods.splice(i,1); catchFood(f); if(state!=="play")break; continue; }
    if(f.y>H+f.size){ foods.splice(i,1); if(!f.bad) combo=0; } }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.cloud){p.vx*=0.97;p.vy*=0.95;p.r+=dt*14;} else p.vy+=400*dt; }
  for(let i=floaters.length-1;i>=0;i--){ const fl=floaters[i]; fl.life-=dt*0.9; fl.y-=50*dt; if(fl.life<=0) floaters.splice(i,1); }
  cx.save(); if(shake>0){ shake-=dt; const a=Math.min(shake,1.2)*33; cx.translate((Math.random()-.5)*a,(Math.random()-.5)*a); }
  drawBg(dt); for(const f of foods) drawFood(f);
  for(const p of parts){ cx.globalAlpha=Math.max(0,p.life/p.max); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); } cx.globalAlpha=1;
  if(phase==="fart") drawBigFart();
  drawPlayer(now);
  cx.textAlign="center"; cx.textBaseline="middle";
  for(const fl of floaters){ cx.globalAlpha=Math.max(0,fl.life); cx.font=`bold ${fl.size}px "Trebuchet MS",sans-serif`; cx.lineWidth=5; cx.strokeStyle="#fff"; cx.strokeText(fl.text,fl.x,fl.y); cx.fillStyle=fl.color; cx.fillText(fl.text,fl.x,fl.y); }
  cx.globalAlpha=1; cx.restore(); }
addEventListener("resize",resize); resize(); reset(); showBestStart();
window.__farty={get state(){return state;},get score(){return score;},get lives(){return lives;},get foods(){return foods.length;},get nut(){return {...nut};},get mood(){return mood();},get phase(){return phase;}};
requestAnimationFrame(t=>{ last=t; step(t); });
})();
</script>
</body>
