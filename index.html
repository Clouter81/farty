<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ed957">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="farty">
<meta name="format-detection" content="telephone=no">
<!-- farty v3.1 (no HUD): turn-based grid, level goals, bottom vs-bars, brown fart-cloud Farty. Fully offline single file, no network requests. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:">
<title>farty 3</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💨</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#bdf0ff;font-family:"Trebuchet MS",system-ui,sans-serif;color:#2b2b40;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
  #ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 4px calc(env(safe-area-inset-bottom) + 6px);pointer-events:none}
  #ui.hidden{display:none}
  #hud{display:flex;justify-content:space-between;align-items:center;gap:5px;width:min(100%,520px);font-weight:bold;font-size:18px}
  .pill{background:rgba(255,255,255,.9);border-radius:20px;padding:4px 9px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
  #goal{border:3px solid #ffb300;font-size:20px;padding:1px 8px}
  #goal.bump{animation:pop .6s}
  #mute{pointer-events:auto;border:none;background:rgba(255,255,255,.9);border-radius:50%;width:36px;height:36px;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.12);cursor:pointer;flex:none}
  /* bottom bar row: 🥩 | 💧vs🧂 | 🌾vs🍬 | 🥑vs🧈 */
  #bars{display:grid;grid-template-columns:.8fr 1fr 1fr 1fr;gap:6px;width:min(100%,560px);background:rgba(255,255,255,.92);border-radius:14px;padding:4px 7px 10px;box-shadow:0 2px 0 rgba(0,0,0,.12);flex:none}
  .bar{position:relative;border-radius:10px;padding:1px 2px 0}
  .ends{display:flex;justify-content:space-between;align-items:flex-end;height:30px}
  .ends i{font-style:normal;font-size:26px;line-height:1;display:inline-block}
  .ends .vs{font-size:11px;font-weight:bold;color:#9a9aa8;align-self:center}
  .trk{position:relative;height:20px;background:#e3e3ea;border-radius:9px;margin-top:2px}
  .gz,.dz{position:absolute;top:0;bottom:0}
  .gz{background:repeating-linear-gradient(45deg,rgba(76,175,80,.22) 0 4px,transparent 4px 8px);border-left:2px dashed rgba(46,125,50,.7)}
  .dz{right:0;border-radius:0 9px 9px 0;background:repeating-linear-gradient(45deg,rgba(229,57,53,.3) 0 4px,transparent 4px 8px);border-left:2px dashed rgba(229,57,53,.85)}
  .mid{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #c9c9d6}
  .gf,.bf{position:absolute;top:0;bottom:0;width:0;transition:width .45s cubic-bezier(.3,1.5,.5,1)}
  .gf{left:0;border-radius:9px 0 0 9px;background:linear-gradient(#81c784,#43a047)}
  .bf{right:0;border-radius:0 9px 9px 0;background:linear-gradient(#ef9a9a,#e53935)}
  .single .gf{border-radius:9px}
  .gl{display:none;position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:#ffb300;box-shadow:0 0 0 1px #fff;z-index:2}
  .gl::after{content:"🚩";position:absolute;left:0;top:-15px;font-size:14px;line-height:1}
  .bar.goal{background:rgba(255,213,79,.4);box-shadow:0 0 0 2px #ffb300}
  .bar.goal .gl{display:block}
  .bar .gi.up,.bar .bi.up{animation:pop .45s}
  .trk.galarm .gf,.trk.balarm .bf{animation:blink .7s infinite}
  .gi.ok{filter:drop-shadow(0 0 3px #ffd54f)}
  #board{pointer-events:auto;border-radius:18px;flex:none}
  #fb{flex:none;height:46px;display:flex;align-items:center;justify-content:center;gap:2px;pointer-events:none;max-width:98vw;width:max-content;overflow:hidden;text-align:center;background:#fff;border-radius:18px;padding:4px 12px;font-size:clamp(18px,5.6vw,26px);white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.12);opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s}
  #fb.show{opacity:1;transform:scale(1)}
  #fb.good{border:3px solid #4caf50}#fb.bad{border:3px solid #ff7043}
  #fb small{font-size:17px}
  .fly{position:fixed;left:0;top:0;z-index:4;pointer-events:none;font-size:26px;line-height:1;transition:transform .55s cubic-bezier(.5,-0.3,.6,1),opacity .55s;will-change:transform}
  @keyframes pop{40%{transform:scale(1.6)}}
  @keyframes blink{50%{opacity:.3}}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:linear-gradient(#bdf0ff,#e9ffd9);z-index:5;overflow-y:auto}
  .screen.hidden{display:none}
  h1{font-size:56px;margin:0;color:#8d6e63;text-shadow:3px 3px 0 #5d4037;letter-spacing:2px}
  h1 sup{font-size:28px;color:#ff9800;text-shadow:2px 2px 0 #e65100}
  #startFarty{width:120px;height:100px;animation:bob 1.6s ease-in-out infinite}
  .big{font-size:min(64px,8vh);line-height:1;margin:6px 0;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .legend{display:flex;flex-direction:column;gap:7px;margin:8px 0;width:min(94vw,380px)}
  .legend div{background:#fff;border-radius:16px;padding:5px 10px;font-size:clamp(18px,6.2vw,26px);box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
  .legend .g{border:3px solid #66bb6a}.legend .r{border:3px solid #ff8a65}.legend .y{border:3px solid #ffb300}
  button.go{margin-top:12px;font-size:44px;line-height:1;border:none;border-radius:50px;padding:14px 46px;background:#4caf50;box-shadow:0 6px 0 #2e7d32;cursor:pointer}
  button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #2e7d32}
  .scores{font-size:30px;font-weight:bold;margin:4px 0}
  .new{display:inline-block;animation:bob 1s infinite}
  .recap{background:#fff;border-radius:16px;padding:8px 12px;margin:6px 0;width:min(92vw,420px);font-size:30px;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.1);word-wrap:break-word}
  .recap.good{border:3px solid #4caf50}.recap.bad{border:3px solid #ff7043}
  .v1{margin-top:10px;font-size:18px;color:#5d4037;opacity:.75;pointer-events:auto}
  .pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);background:#fff;border-radius:26px;padding:14px 26px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.15);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.7,.5,1);pointer-events:none;z-index:4}
  .pop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #lvl{border:4px solid #ffb300}
  .pop .rf{font-size:80px;line-height:1.1}
  .pop .rs{font-size:40px;letter-spacing:4px}
  .pop .rr{font-size:26px;font-weight:bold;color:#2e7d32}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui" class="hidden">
  <div id="board"></div>
  <div id="fb"></div>
  <div id="bars"></div>
</div>
<div class="pop" id="rres"></div>
<div class="pop" id="lvl"></div>

<div class="screen" id="start">
  <h1>farty<sup>2</sup></h1>
  <canvas id="startFarty" width="240" height="200"></canvas>
  <div class="legend">
    <div>👆 🍎 → 🦘 → 😋</div>
    <div class="y">🎯🥩 ⬆️ 🚩 → 💨 → ⭐⭐⭐</div>
    <div class="g">🥩💧🌾🥑 ⬆️ → 😄</div>
    <div class="r">🧂🍬🧈 ⬆️ → 🤢</div>
    <div>🤢 → 💔 &nbsp; 💔💔💔 → 🏳️</div>
  </div>
  <button class="go" id="playBtn" aria-label="start">▶️</button>
  <p class="scores" id="bestStart"></p>
  <p><a class="v1" href="v1/" aria-label="versie 1">🕹️ v1</a> &nbsp; <a class="v1" href="v2/" aria-label="versie 2">🕹️ v2</a></p>
</div>

<div class="screen hidden" id="over">
  <div class="big" id="overFace">😮‍💨</div>
  <p class="scores" id="finalScore"></p>
  <p class="scores" id="bestScore"></p>
  <div class="recap good" id="recapGood"></div>
  <div class="recap bad" id="recapBad"></div>
  <button class="go" id="againBtn" aria-label="opnieuw">🔁</button>
</div>

<script>
(() => {
"use strict";
const Q=new URLSearchParams(location.search);
// 4 bars. Pairs = one bar: good side fills green from the left, bad side fills red from the right.
const BARS=[
  {id:"pro", g:{k:"pro", i:"🥩",n:"eiwitten"}},
  {id:"wat", g:{k:"wat", i:"💧",n:"water"}, b:{k:"salt",i:"🧂",n:"zout"}},
  {id:"carb",g:{k:"carb",i:"🌾",n:"trage suikers"}, b:{k:"sug",i:"🍬",n:"snelle suikers"}},
  {id:"fat", g:{k:"fat", i:"🥑",n:"goede (onverzadigde) vetten"}, b:{k:"sat",i:"🧈",n:"slechte (verzadigde) vetten"}},
];
const GOODN=BARS.map(b=>b.g), BADN=BARS.filter(b=>b.b).map(b=>b.b);
const NUTS=[...GOODN,...BADN];
const NI=Object.fromEntries(NUTS.map(x=>[x.k,x.i]));
const GOOD_SPAN=60, BAD_SPAN=40; // share of a pair bar: good side 0..100 -> 0..60% from left, bad side 0..100 -> 0..40% from right
const GOOD_MIN=40, BAD_WARN=40, BAD_SICK=70, LOW_SICK=15;
// Rough, real-world-ish nutrient profile per portion (points on a 0-100 bar)
const FOODS=[
  // healthy
  {e:"🥦",nu:{pro:6,carb:6,wat:10},toot:true},
  {e:"🫘",nu:{pro:15,carb:15},toot:true},
  {e:"🥕",nu:{carb:8,wat:10}},
  {e:"🍎",nu:{carb:5,wat:9,sug:4}},
  {e:"🍌",nu:{carb:10,sug:7}},
  {e:"🍓",nu:{wat:12,carb:4,sug:3}},
  {e:"🫐",nu:{carb:6,wat:6,sug:3}},
  {e:"🥝",nu:{wat:10,carb:5}},
  {e:"🍊",nu:{wat:14,carb:3,sug:4}},
  {e:"🥬",nu:{wat:12,carb:3}},
  {e:"🍠",nu:{carb:20}},
  {e:"🥔",nu:{carb:18}},
  {e:"🌽",nu:{carb:15,pro:3}},
  {e:"🥣",nu:{carb:22,pro:6}},        // havermout
  {e:"🍚",nu:{carb:14,pro:3}},
  {e:"🐟",nu:{pro:20,fat:18}},        // vette vis: omega 3
  {e:"🥜",nu:{fat:17,pro:9}},
  {e:"🌰",nu:{fat:15,pro:6}},
  {e:"🥑",nu:{fat:20,carb:3,wat:4}},
  {e:"🫒",nu:{fat:15,salt:8}},
  {e:"🥚",nu:{pro:16,fat:4,sat:4}},
  {e:"🍗",nu:{pro:22,sat:4}},
  {e:"🥛",nu:{pro:10,wat:10,sat:5}},
  {e:"🍐",nu:{carb:7,wat:8,sug:3},toot:true},
  {e:"🍉",nu:{wat:22,sug:4}},
  {e:"💧",nu:{wat:30}},
  {e:"🍵",nu:{wat:24}},
  // in between
  {e:"🧀",nu:{pro:10,sat:14,salt:10}},
  {e:"🍞",nu:{carb:12,pro:4,salt:6,sug:3}},
  // unhealthy (salty snacks also make you thirsty: water ⬇️)
  {e:"🍬",nu:{sug:24}},
  {e:"🍭",nu:{sug:24}},
  {e:"🥤",nu:{sug:26,wat:5}},
  {e:"🍩",nu:{sug:18,sat:14}},
  {e:"🧁",nu:{sug:18,sat:10}},
  {e:"🍪",nu:{sug:16,sat:10}},
  {e:"🍫",nu:{sug:16,sat:14}},
  {e:"🍦",nu:{sug:16,sat:12}},
  {e:"🍟",nu:{salt:18,sat:14,carb:3,wat:-4}},
  {e:"🥨",nu:{salt:22,sug:6,wat:-4}},
  {e:"🌭",nu:{salt:22,sat:14,pro:6,wat:-4}},
  {e:"🍔",nu:{sat:18,salt:14,pro:10}},
  {e:"🍕",nu:{sat:14,salt:16,pro:6,carb:4}},
  {e:"🥓",nu:{salt:20,sat:16,pro:8,wat:-4}},
];
const sumOf=(f,list)=>list.reduce((s,x)=>s+(f.nu[x.k]||0),0);
FOODS.forEach(f=>{ f.bad=sumOf(f,BADN)>sumOf(f,GOODN); });
const HEALTHY=FOODS.filter(f=>!f.bad&&f.e!=="💧"), JUNK=FOODS.filter(f=>f.bad), DRINK=FOODS.filter(f=>f.e==="💧"||f.e==="🍵"||f.e==="🍉");


const cv=document.getElementById("game"), cx=cv.getContext("2d"), $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,B={x:0,y:0,w:300,h:420,c:60};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const COLS=5, HC=2; let ROWS=7, HR=3;   // Farty sits in the centre cell; rows adapt to the screen height (odd, 5..11)

function layout(){
  const ui=$("ui"); const hidden=ui.classList.contains("hidden"); if(hidden){ ui.style.visibility="hidden"; ui.classList.remove("hidden"); }
  const cs=getComputedStyle(ui), pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  const availW=W-12, availH=H-$("bars").offsetHeight-$("fb").offsetHeight-6*2-pad-10;
  const cw=Math.floor(Math.min(availW/COLS,availH/5,100));
  ROWS=Math.max(5,Math.min(13,Math.floor(availH/cw))); if(ROWS%2===0) ROWS--; HR=(ROWS-1)/2;
  const ch=Math.floor(Math.min(availH/ROWS,cw*1.18));   // stretch rows a little so the grid fills the height
  $("board").style.width=cw*COLS+"px"; $("board").style.height=ch*ROWS+"px";
  const r=$("board").getBoundingClientRect(); B={x:r.left,y:r.top,w:r.width,h:r.height,cw,ch,c:Math.min(cw,ch)};
  if(hidden){ ui.classList.add("hidden"); ui.style.visibility=""; } }
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2.5); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); layout(); }

// ---------- Audio (from v1) ----------
let ac=null; const muted=false; // sound is always on
function initAudio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}} if(ac&&ac.state==="suspended")ac.resume(); }
function tone(fq,dur,type="sine",vol=0.15,to=null,delay=0){ if(muted||!ac)return; const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(fq,t); if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02); }
const sfx={
  jump(far){ tone(300,far?0.3:0.22,"triangle",0.12,far?900:700); },
  land(){ tone(140,0.08,"sine",0.15,90); },
  good(){ tone(660,0.09,"triangle",0.15); tone(990,0.12,"triangle",0.13,null,0.07); },
  bad(){ tone(200,0.3,"square",0.08,90); },
  hurt(){ tone(330,0.18,"square",0.07,160); tone(220,0.25,"square",0.07,110,0.15); },
  toot(){ if(muted||!ac)return; const t=ac.currentTime,d=0.55,o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter();
    o.type="sawtooth"; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(70,t+d); l.frequency.value=28; lg.gain.value=30; l.connect(lg).connect(o.frequency);
    f.type="lowpass"; f.frequency.value=700; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(f).connect(g).connect(ac.destination); o.start(t); l.start(t); o.stop(t+d+0.05); l.stop(t+d+0.05); tone(1200,0.15,"sine",0.06,1800,d); },
  bigFart(){ if(muted||!ac)return; const t=ac.currentTime,d=1.4;
    const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter();
    o.type="sawtooth"; o2.type="square"; o.frequency.setValueAtTime(110,t); o.frequency.linearRampToValueAtTime(150,t+0.35); o.frequency.exponentialRampToValueAtTime(55,t+d);
    o2.frequency.setValueAtTime(57,t); o2.frequency.exponentialRampToValueAtTime(40,t+d);
    l.type="sine"; l.frequency.setValueAtTime(22,t); l.frequency.linearRampToValueAtTime(35,t+d); lg.gain.value=40; l.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    f.type="lowpass"; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(300,t+d); f.Q.value=4;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.05); g.gain.setValueAtTime(0.45,t+d*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(f); o2.connect(f); f.connect(g).connect(ac.destination);
    const nb=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate), ch=nb.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
    const ns=ac.createBufferSource(), nf=ac.createBiquadFilter(), ng=ac.createGain(); ns.buffer=nb; nf.type="bandpass"; nf.frequency.value=400; ng.gain.setValueAtTime(0.12,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+d);
    ns.connect(nf).connect(ng).connect(ac.destination);
    [o,o2,l,ns].forEach(n=>{n.start(t); n.stop(t+d+0.05);}); tone(1500,0.25,"sine",0.07,2400,d+0.05); },
  round(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.12,"triangle",0.12,null,i*0.08)); },
  over(){ [523,440,349,262].forEach((f,i)=>tone(f,0.22,"triangle",0.14,null,i*0.16)); },
  start(){ [392,523,659].forEach((f,i)=>tone(f,0.12,"triangle",0.13,null,i*0.08)); },
};
// ---------- Bars ----------
const nut={}, barEl={};
$("bars").innerHTML=BARS.map(b=>`<div class="bar${b.b?"":" single"}" id="bar_${b.id}" title="${b.g.n}${b.b?" / "+b.b.n:""}" aria-label="${b.g.n}${b.b?" / "+b.b.n:""}">
  <div class="ends"><i class="gi">${b.g.i}</i>${b.b?`<span class="vs">⇄</span><i class="bi">${b.b.i}</i>`:""}</div>
  <div class="trk"><div class="gz" style="left:${40*(b.b?GOOD_SPAN:100)/100}%;width:${(b.b?GOOD_SPAN:100)*0.6}%"></div>${b.b?`<div class="dz" style="width:${30*BAD_SPAN/100}%"></div><div class="mid" style="left:${GOOD_SPAN}%"></div>`:""}<div class="gf"></div>${b.b?'<div class="bf"></div>':""}<div class="gl"></div></div></div>`).join("");
BARS.forEach(b=>{ const box=$("bar_"+b.id), trk=box.querySelector(".trk");
  barEl[b.g.k]={box,trk,fill:box.querySelector(".gf"),icon:box.querySelector(".gi"),gl:box.querySelector(".gl"),span:b.b?GOOD_SPAN:100,bad:false};
  if(b.b) barEl[b.b.k]={box,trk,fill:box.querySelector(".bf"),icon:box.querySelector(".bi"),span:BAD_SPAN,bad:true}; });
function resetNut(){ GOODN.forEach(x=>nut[x.k]=55); BADN.forEach(x=>nut[x.k]=5); nut.wat=65; renderBars(); }
function pulse(k){ const e=barEl[k].icon; e.classList.remove("up"); void e.offsetWidth; e.classList.add("up"); }
function mood(){ const g=GOODN.map(x=>nut[x.k]), b=BADN.map(x=>nut[x.k]);
  if(b.some(v=>v>=BAD_SICK)||g.some(v=>v<=LOW_SICK)) return "sick";
  if(g.every(v=>v>=GOOD_MIN)&&b.every(v=>v<BAD_WARN)) return "healthy";
  return "ok"; }
function renderBars(){ NUTS.forEach(x=>{ const v=nut[x.k], e=barEl[x.k];
    e.fill.style.width=(v*e.span/100).toFixed(1)+"%";
    if(e.bad) e.trk.classList.toggle("balarm",v>=BAD_SICK); else { e.trk.classList.toggle("galarm",v<=LOW_SICK+5); e.icon.classList.toggle("ok",v>=GOOD_MIN); } }); }
const clamp=v=>Math.max(0,Math.min(100,v));

let world=new Map(), fx=0, fy=0, cam={x:0,y:0};
const key=(x,y)=>x+","+y, pick=a=>a[(Math.random()*a.length)|0];
const MIN_FOOD=4, MAX_FOOD=8;
function junkChance(){ return Math.min(0.45,0.3+(level-1)*0.03); }
function genFood(){ const r=Math.random(); if(r<0.12) return pick(DRINK); if(r<0.12+junkChance()) return pick(JUNK);
  return Math.random()<0.15?pick(HEALTHY.filter(f=>f.toot)):pick(HEALTHY); }
function tile(x,y){ const k=key(x,y); if(!world.has(k)) world.set(k,{item:null,pop:1}); return world.get(k); }
function visible(){ const o=[]; for(let y=-HR;y<=HR;y++)for(let x=-HC;x<=HC;x++){ if(x||y) o.push(tile(fx+x,fy+y)); } return o; }
function prune(){ for(const k of world.keys()){ const [x,y]=k.split(",").map(Number); if(Math.abs(x-fx)>HC+2||Math.abs(y-fy)>HR+2) world.delete(k); } }
const useful=(f,k)=>f&&!f.bad&&(f.nu[k]||0)>=12;
function stock(){ // keep 4..8 foods on the board; always something useful in reach
  const cells=visible(), withFood=()=>cells.filter(t=>t.item), empty=()=>cells.filter(t=>!t.item);
  const place=f=>{ const e=empty(); if(withFood().length<MAX_FOOD&&e.length){ const t=pick(e); t.item=f; t.pop=0; return true; }
    const j=withFood().filter(t=>t.item.bad); if(j.length){ const t=pick(j); t.item=f; t.pop=0; return true; } return false; };
  while(withFood().length>MAX_FOOD){ const t=pick(withFood()); t.item=null; }
  const target=MIN_FOOD+((Math.random()*(MAX_FOOD-MIN_FOOD-1))|0)+1; // 5..7
  while(withFood().length<target) place(genFood());
  const needs=[goal.k,...GOODN.filter(x=>nut[x.k]<50).map(x=>x.k)];
  for(const k of [...new Set(needs)]) if(!cells.some(t=>useful(t.item,k))) place(pick(FOODS.filter(f=>useful(f,k))));
  if(cells.filter(t=>t.item&&!t.item.bad).length<3) place(pick(HEALTHY)); }

function tap(dx,dy){

  dx=Math.max(-HC,Math.min(HC,dx|0)); dy=Math.max(-HR,Math.min(HR,dy|0)); if(!dx&&!dy) return false;
  const dist=Math.hypot(dx,dy);
  jump={t:0,dur:Math.min(0.8,0.45+dist*0.07),dist,from:{x:fx,y:fy},to:{x:fx+dx,y:fy+dy}};
  for(let y=-HR-1;y<=HR+1;y++)for(let x=-HC-1;x<=HC+1;x++) tile(jump.to.x+x,jump.to.y+y);
  sfx.jump(dist>2); player.squish=0.8; drain(); phase="jump"; return true; }
function land(){ const j=jump; jump=null; fx=j.to.x; fy=j.to.y; cam={x:fx,y:fy}; player.squish=1; sfx.land();
  const t=tile(fx,fy), item=t.item; t.item=null;
  if(item){ for(const k in item.nu) nut[k]=clamp(nut[k]+item.nu[k]);
    showFb(item); flyToBars(item,PX(),PY()-PR()*0.3);
    if(item.bad){ eatenBad.push(item.e); sfx.bad(); player.sad=1; burst(PX(),PY(),["#ff7043","#ffb199","#ffd54f"],10); }
    else { eatenGood.push(item.e); sfx.good(); player.mouth=1; burst(PX(),PY(),["#66bb6a","#ffee58","#ffffff","#81d4fa"],12);
      const gain=GOODN.reduce((s,x)=>s+(x.k==="wat"?0.6:1)*Math.max(0,item.nu[x.k]||0),0); let pts=Math.round(gain/2);
      if(item.toot){ pts*=2; setTimeout(toot,250); }
      score+=pts; floater("+"+pts,PX(),PY()-PR()*1.9,"#2e7d32",26); } }
  else renderBars();
  const m=mood(); turnLog.push(m); turns++;
  if(m==="healthy"){ score+=5; floater("✨",PX()+PR()*1.5,PY()-PR(),"#ffb300",30); }
  if(m==="sick"){ lives--; player.sad=1; shake=0.4; setTimeout(sfx.hurt,150); floater("💔",PX(),PY()-B.ch*1.1,"#d84315",40); setTimeout(()=>floater(hearts(),PX(),PY()-B.ch*0.75,"#d84315",24),350); }
  updateHud(); prune(); stock();
  if(lives<=0){ phase="dead"; setTimeout(gameOver,900); return; }

  else phase="idle"; }

// Farty = a cute little brown fart cloud (prootje)

const PUFFS=[[0,0.2,1.18,0.46],[-0.55,-0.14,0.44,0.44],[0.08,-0.26,0.48,0.48],[0.66,-0.1,0.4,0.4],[1.05,0.16,0.3,0.3],[-1.05,0.14,0.32,0.32]];

  if(m==="sick"){ g.strokeStyle="#2b1d16"; g.lineWidth=r*0.07; for(const s of [-1,1]){ g.beginPath(); g.moveTo(s*r*0.42,fy-r*0.1); g.lineTo(s*r*0.24,fy); g.lineTo(s*r*0.42,fy+r*0.08); g.stroke(); } }
  else { for(const s of [-1,1]){ g.beginPath(); g.ellipse(s*r*0.3,fy,r*0.11,r*0.15*blink,0,0,7); g.fill(); }
    g.fillStyle="#fff"; for(const s of [-1,1]){ g.beginPath(); g.arc(s*r*0.3+r*0.04,fy-r*0.06,r*0.045,0,7); g.fill(); } }
  if(m!=="sick"){ g.fillStyle="rgba(255,130,150,0.6)"; for(const s of [-1,1]){ g.beginPath(); g.ellipse(s*r*0.6,fy+r*0.22,r*0.13,r*0.07,0,0,7); g.fill(); } }
  g.fillStyle="#5a1f2a"; g.strokeStyle="#5a1f2a"; g.lineWidth=r*0.07;
  if(p.sad>0.3){ g.beginPath(); g.arc(0,fy+r*0.48,r*0.17,Math.PI*1.15,Math.PI*1.85); g.stroke(); }
  else if(m==="sick"){ g.beginPath(); for(let i=0;i<=8;i++){ const xx=-r*0.24+i*r*0.06, yy=fy+r*0.34+(i%2?-1:1)*r*0.04; i?g.lineTo(xx,yy):g.moveTo(xx,yy);} g.stroke(); }
  else { const mo=0.09+p.mouth*0.15+(m==="healthy"?0.04:0)+(lift>0?0.1:0); g.beginPath(); g.ellipse(0,fy+r*0.26,r*0.19,r*mo,0,0,Math.PI); g.fill(); }
  g.restore(); }
function drawFarty(t){ const r=PR()*1.0, m=state==="play"?mood():"ok"; let x=PX(), y=PY()+r*0.05, lift=0;
  if(jump){ const k=Math.min(1,jump.t/jump.dur); lift=Math.sin(Math.PI*k)*B.ch*(0.8+Math.min(jump.dist,4)*0.12); }
  cx.save(); cx.fillStyle="rgba(0,0,0,0.18)"; cx.beginPath(); cx.ellipse(x,y+r*0.95,r*(0.95-lift/B.c*0.25),r*0.2,0,0,7); cx.fill(); cx.restore();
  drawFartyAt(cx,x,y-lift,r,m,player,t,lift);
  if(state==="play"&&m!=="ok"&&!jump){ cx.font=`${r*0.7}px ${EMO}`; cx.textAlign="center"; cx.textBaseline="middle";
    cx.fillText(m==="sick"?"🤢":"✨", x+r*1.2, y-r*1.05+Math.sin(t*0.005)*3); } }
const sf=$("startFarty").getContext("2d");
function drawStart(t){ sf.clearRect(0,0,240,200); drawFartyAt(sf,140,112,52,"healthy",{squish:0,sad:0,tootT:0,mouth:0.6},t,0); }

// ---------- Loop ----------
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function step(now){ requestAnimationFrame(step); let dt=Math.min(0.05,(now-last)/1000); last=now; if(!(dt>0)) dt=0.016;
  if(state!=="play"){ drawBg(dt); if(state==="start") drawStart(now); return; }
  if(jump){ jump.t+=dt; const k=Math.min(1,jump.t/jump.dur), e=ease(k); cam={x:jump.from.x+(jump.to.x-jump.from.x)*e,y:jump.from.y+(jump.to.y-jump.from.y)*e}; if(k>=1) land(); }
  if(phase==="fart"||phase==="result"||phase==="intro") phaseUpdate(dt);
  player.squish=Math.max(0,player.squish-dt*4); player.mouth=Math.max(0,player.mouth-dt*2.5); player.sad=Math.max(0,player.sad-dt*1.2);
  if(player.tootT>0){ player.tootT-=dt; if(Math.random()<dt*6) parts.push({x:PX()+(Math.random()-.5)*PR(),y:PY()+PR()*0.7,vx:(Math.random()-.5)*40,vy:30,life:0.8,max:0.8,c:GAS(0.35),r:6+Math.random()*6,cloud:true}); }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.cloud){p.vx*=0.97;p.vy*=0.95;p.r+=dt*14;} else p.vy+=400*dt; }
  for(let i=floaters.length-1;i>=0;i--){ const fl=floaters[i]; fl.life-=dt*0.9; fl.y-=45*dt; if(fl.life<=0) floaters.splice(i,1); }
  cx.save(); if(shake>0){ shake-=dt; const a=Math.min(shake,1.2)*28; cx.translate((Math.random()-.5)*a,(Math.random()-.5)*a); }
  drawBg(dt); drawBoard(now,dt);
  for(const p of parts){ cx.globalAlpha=Math.max(0,p.life/p.max); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); } cx.globalAlpha=1;
  if(phase==="fart") drawBigFart();
  drawFarty(now);
  cx.textAlign="center"; cx.textBaseline="middle";
  for(const fl of floaters){ cx.globalAlpha=Math.max(0,fl.life); cx.font=`bold ${fl.size}px "Trebuchet MS",${EMO}`; cx.lineWidth=5; cx.strokeStyle="#fff"; cx.strokeText(fl.text,fl.x,fl.y); cx.fillStyle=fl.color; cx.fillText(fl.text,fl.x,fl.y); }
  cx.globalAlpha=1; cx.restore(); }
addEventListener("resize",()=>{ resize(); }); resize(); reset(); showBestStart();
window.__farty={version:"3",tap,start:startGame,get state(){return state;},get score(){return score;},get lives(){return lives;},get nut(){return {...nut};},get mood(){return mood();},get phase(){return phase;},get turns(){return turns;},get level(){return level;},get goal(){return {...goal};},get rows(){return ROWS;},
  around(){ const o=[]; for(let y=-HR;y<=HR;y++)for(let x=-HC;x<=HC;x++){ const t=tile(fx+x,fy+y); o.push({x,y,e:t.item?t.item.e:null,bad:t.item?t.item.bad:null,nu:t.item?t.item.nu:null}); } return o; }};
if(Q.get("autostart")==="1") startGame();
requestAnimationFrame(t=>{ last=t; step(t); });
})();
