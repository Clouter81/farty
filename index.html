<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#bdf0ff;font-family:"Trebuchet MS",system-ui,sans-serif;color:#2b2b40;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
  #ui{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 4px calc(env(safe-area-inset-bottom) + 6px);pointer-events:none}
  #ui.hidden{display:none}
  #bars{display:grid;gap:6px;width:min(100%,560px);background:rgba(255,255,255,.92);border-radius:14px;padding:4px 7px 10px;box-shadow:0 2px 0 rgba(0,0,0,.12);flex:none}
  .bar{position:relative;border-radius:10px;padding:1px 2px 0}
  .bar.new{animation:pop .7s 2}
  .ends{display:flex;justify-content:space-between;align-items:flex-end;height:30px}
  .ends i{font-style:normal;font-size:26px;line-height:1;display:inline-block}
  .ends .vs{font-size:11px;font-weight:bold;color:#9a9aa8;align-self:center}
  .trk{position:relative;height:20px;display:flex;gap:4px;margin-top:2px}
  .half{position:relative;flex:1;display:flex;gap:2px}
  .half.b{flex-direction:row-reverse}            /* pair: bad red fills from the centre to the LEFT; good green (and 🥚) to the RIGHT */
  .blk{position:relative;flex:1;background:#e3e3ea;border-radius:4px;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
  .blk b,.blk s{position:absolute;top:0;bottom:0;width:0;transition:width .4s cubic-bezier(.3,1.4,.5,1),left .4s}
  .g .blk b{left:0;background:#a5d6a7}
  .b .blk b{right:0;background:#ef9a9a}
  .g .blk.full b{background:linear-gradient(#66bb6a,#2e7d32)}
  .b .blk.full b{background:linear-gradient(#ef5350,#c62828)}
  .blk s{background:repeating-linear-gradient(45deg,#9e9e9e 0 3px,#cfcfcf 3px 6px)}   /* blocked by 🧂/🍬/🧈 */
  .pair .half.g .blk:last-child{border-radius:2px 4px 4px 2px} .half.b .blk:last-child{border-radius:4px 2px 2px 4px}
  .pair .trk::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #c9c9d6}
  .gl{display:none;position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:#ffb300;box-shadow:0 0 0 1px #fff;z-index:2}
  .gl::after{content:"🚩";position:absolute;left:-12px;top:-15px;font-size:14px;line-height:1}
  .bar.goal{background:rgba(255,213,79,.4);box-shadow:0 0 0 2px #ffb300}
  .bar.goal .gl{display:block}
  .bar .gi.up,.bar .bi.up{animation:pop .45s}
  .half.b.alarm .blk b{animation:blink .6s infinite}
  .half.g.alarm .blk{animation:blink .6s infinite;box-shadow:inset 0 0 0 2px #e53935}
  #board{position:relative;pointer-events:auto;border-radius:18px;flex:none;overflow:hidden}
  #board .fog{position:absolute;pointer-events:none;background:rgba(235,235,235,.35);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);display:none}
  .fly{position:fixed;left:0;top:0;z-index:4;pointer-events:none;font-size:26px;line-height:1;transition:transform .55s cubic-bezier(.5,-0.3,.6,1),opacity .55s;will-change:transform}
  @keyframes pop{40%{transform:scale(1.25)}}
  @keyframes blink{50%{opacity:.3}}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);text-align:center;background:linear-gradient(#bdf0ff,#e9ffd9);z-index:5;overflow-y:auto}
  .screen.hidden{display:none}
  h1{font-size:56px;margin:0;color:#8d6e63;text-shadow:3px 3px 0 #5d4037;letter-spacing:2px}
  h1 sup{font-size:28px;color:#ff9800;text-shadow:2px 2px 0 #e65100}
  .sf{width:120px;height:100px;animation:bob 1.6s ease-in-out infinite}
  #lvls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:6px 0}
  #lvls button{pointer-events:auto;border:none;border-radius:20px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);width:74px;height:86px;font-size:38px;line-height:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  #lvls button small{font-size:13px;letter-spacing:-1px}
  #lvls button.lock{opacity:.45}
  #lvls button.next{box-shadow:0 0 0 4px #ffb300,0 4px 0 rgba(0,0,0,.15);animation:bob 1.4s infinite}
  button.go{pointer-events:auto;margin-top:8px;font-size:44px;line-height:1;border:none;border-radius:50px;padding:14px 46px;background:#4caf50;box-shadow:0 6px 0 #2e7d32;cursor:pointer}
  button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #2e7d32}
  .v1{margin-top:6px;font-size:16px;color:#5d4037;opacity:.75;pointer-events:auto}
  /* info screen */
  #info .num{font-size:22px;font-weight:bold;color:#5d4037}
  #info .ico{font-size:min(110px,14vh);line-height:1;animation:bob 1.6s ease-in-out infinite}
  .card{background:#fff;border-radius:18px;padding:6px 14px;font-size:clamp(24px,7.5vw,38px);line-height:1.25;box-shadow:0 3px 0 rgba(0,0,0,.1);width:min(94vw,440px)}
  .card.g{border:3px solid #66bb6a}.card.r{border:3px solid #ff8a65}.card.y{border:3px solid #ffb300}
  .card .vs{font-size:.6em;color:#9a9aa8;font-weight:bold}
  .pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);background:#fff;border-radius:26px;padding:14px 26px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.15);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.7,.5,1);pointer-events:none;z-index:4}
  .pop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .pop.show.tap{pointer-events:auto;cursor:pointer}
  .pop .rf{font-size:80px;line-height:1.1}
  .pop .rs{font-size:40px;letter-spacing:4px}
  .pop .rr{font-size:28px;font-weight:bold;color:#2e7d32}
  #final .stars{font-size:30px;line-height:1.5}
</style>

<script>
(() => {
"use strict";
const Q=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
// ---------- Nutrients (values are in BLOCKS: 0..4) ----------
const NI={pro:"🥚",wat:"💧",salt:"🧂",carb:"🌾",sug:"🍬",fat:"🥑",sat:"🧈"};
const NAME={pro:"eiwitten",wat:"water",salt:"zout",carb:"trage suikers",sug:"snelle suikers",fat:"goede vetten",sat:"slechte vetten"};
const BADK=new Set(["salt","sug","sat"]);
const F={ // per portion, in blocks
  "🥚":{pro:1.2},"🐟":{pro:1.1,fat:1.2,wat:.2},"🫘":{pro:1,carb:.8},"🧀":{pro:.8,salt:1,sat:.8},"🍗":{pro:1.2,sat:.3},"🥜":{pro:.6,fat:1.1,salt:.3},"🥛":{pro:.6,wat:.8,sat:.3},
  "💧":{wat:2},"🍉":{wat:1.6,sug:.3},"🥒":{wat:1.3},"🍊":{wat:1.1,sug:.3,carb:.2},"🍵":{wat:1.5},
  "🍟":{salt:1.4,sat:.8,carb:.3},"🥓":{salt:1.4,pro:.6,sat:1},"🍕":{salt:1.2,sat:.9,carb:.5,pro:.4},"🥨":{salt:1.5,carb:.4},
  "🍞":{carb:1.2,salt:.2},"🍝":{carb:1.5,pro:.3},"🥔":{carb:1.3},"🍌":{carb:1,sug:.4},"🍚":{carb:1.2},
  "🍭":{sug:2},"🥤":{sug:2,wat:.3},"🍩":{sug:1.5,sat:1},"🍬":{sug:1.8},
  "🥑":{fat:1.5},"🫒":{fat:1.2,salt:.4},"🧈":{sat:1.6},"🍔":{sat:1.2,salt:1,pro:.6},"🍰":{sat:1,sug:1.2},
  "🍎":{carb:.4,wat:.4},"🥕":{carb:.3,wat:.4},"🍓":{wat:.5,sug:.2},"🥦":{pro:.3,wat:.3,carb:.3}};
const G={pro:["🥚","🐟","🫘","🧀","🍗","🥛","🥜"],wat:["💧","🍉","🥒","🍊","🍵"],salty:["🍟","🥓","🍕","🥨","🧀"],slow:["🍞","🍝","🥔","🍌","🍚","🫘"],fast:["🍭","🥤","🍩","🍬"],gfat:["🥑","🐟","🥜","🫒"],bfat:["🧈","🥓","🍔","🍰"],fill:["🍎","🥕","🍓","🥦"]};
// ---------- Levels ----------
const LV=[
 {n:1,k:"pro",nuts:["pro"],bars:[["pro"]],flag:[0,-9],moat:2,start:{pro:.5},par:9,
  pool:[["pro",.6],["fill",.4]],
  info:{does:"🧱💪",foods:"🥚🐟🫘🧀",mech:["🥚 ⬆️ → 💨⬆️ 🦘↔️⬆️","🟩🟩🟩🟩 + 🏁 → 💨⭐"]}},
 {n:2,k:"wat",nuts:["pro","wat"],bars:[["pro"],["wat"]],flag:[1,-9],desert:[-6,-4],start:{pro:2,wat:3},par:9,
  pool:[["wat",.35],["pro",.35],["fill",.3]],
  info:{does:"❤️",foods:"💧🍉🥒🍊",mech:["🦘 → 💧⬇️ &nbsp; 💧0 → 😵","🏜️ → 💧💧 ✅"]}},
 {n:3,k:"salt",nuts:["pro","wat","salt"],bars:[["pro"],["wat","salt"]],flag:[-1,-10],desert:[-6,-4],start:{pro:2,wat:2.5,salt:.5},par:10,
  pool:[["salty",.35],["wat",.25],["pro",.2],["fill",.2]],
  info:{head:"🧂⬆️",does:"💧⬇️ 🫀⚠️",foods:"🍟🥓🧀🍕",bad:true,mech:["🧂🧂 → 💧🚫","🧂 👍 &nbsp; 🧂🧂🧂 👎"]}},
 {n:4,k:"carb",nuts:["pro","wat","salt","carb","sug"],bars:[["pro"],["wat","salt"],["carb","sug"]],flag:[0,-13],desert:[-8,-6],start:{pro:2,wat:3,salt:.5,carb:1,sug:0},par:9,
  pool:[["slow",.3],["fast",.25],["wat",.2],["salty",.1],["pro",.15]],
  info:{does:"⚡🔋⏳",does2:["🍬","⚡💥"],foods:"🍞🍝🥔🍌",foods2:"🍭🥤🍩",mech:["⚡⚡ → 🦘🦘","🍬0 → 😴 &nbsp; 🍬 → 🌾🚫"]}},
 {n:5,k:"fat",nuts:["pro","wat","salt","carb","sug","fat","sat"],bars:[["pro"],["wat","salt"],["carb","sug"],["fat","sat"]],flag:[4,-12],desert:[-7,-5],start:{pro:2,wat:3,salt:.5,carb:1.5,sug:0,fat:0,sat:0},par:11,
  pool:[["gfat",.25],["bfat",.25],["wat",.15],["slow",.15],["pro",.1],["fast",.1]],
  info:{does:"🧠❤️",does2:["🧈","🫀🚫"],foods:"🥑🐟🥜🫒",foods2:"🧈🥓🍔🍰",mech:["🥑 → 🔍➖ 👀⬆️","🧈 → 🌫️ &nbsp; 🧈 → 🥑🚫"]}},
];
const DRAIN={pro:.1,wat:.15,salt:.15,carb:.2,sug:.45,fat:.1,sat:.08};
const MAXR=5;
// ---------- Canvas / layout ----------
const cv=$("game"), cx=cv.getContext("2d");
let W=0,H=0,DPR=1,B={x:0,y:0,w:300,h:420,cw:60,ch:60,c:60};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let COLS=7, HC=3, ROWS=11, HR=5;   // Farty always sits in the centre cell (odd counts)
const CELL=72, MIN_COLS=7, MIN_ROWS=11, MAX_COLS=23, MAX_ROWS=19, GAP=7;
const oddNear=(x,lo,hi)=>{ let n=Math.round(x); if(n%2===0) n=(x>=n?n+1:n-1); return Math.max(lo,Math.min(hi,n)); };
// game state (declared before the first layout)
let L=LV[0], nut={}, world=new Map(), fx=0, fy=0, cam={x:0,y:0};
let state="start", phase="idle", phaseT=0, jump=null, turns=0, jumps=0, jumpsLeft=1, unlocked=false, crash=false, score=0, zoomZ=0, hadSugar=false;
let parts=[],floaters=[],clouds=[],shake=0,last=0;
const player={mouth:0,squish:0,sad:0,tootT:0};
const cl=(v)=>Math.max(0,Math.min(4,v));
const has=k=>L.nuts.includes(k);
const effWat=()=>has("salt")?Math.max(0,nut.wat-Math.max(0,nut.salt-1)):nut.wat;   // 1 salt block is OK, every extra salt block blocks a water block
const effCarb=()=>has("sug")?Math.max(0,nut.carb-nut.sug):nut.carb;                 // fast sugar blocks slow-sugar blocks
const effFat=()=>has("sat")?Math.max(0,nut.fat-nut.sat):nut.fat;                    // bad fat blocks good fat blocks
const range=()=>Math.min(MAXR,1+Math.floor(nut.pro+1e-6));                          // 🥚: +1 cell per FULL block
const energy=()=>has("carb")?effCarb()+nut.sug:0;
const jumpsPerTurn=()=>has("carb")?1+Math.floor(energy()/2+1e-6):1;
const fogRings=()=>L.n===5?Math.min(3,Math.floor(nut.sat+1e-6)):0;
const zoomRings=()=>(state==="play"&&L.n===5)?Math.floor(effFat()+1e-6):0;

function layout(){
  const ui=$("ui"); ui.style.height=H+"px";
  const hidden=ui.classList.contains("hidden"); if(hidden){ ui.style.visibility="hidden"; ui.classList.remove("hidden"); }
  const cs=getComputedStyle(ui), padT=parseFloat(cs.paddingTop)||0, padB=parseFloat(cs.paddingBottom)||0, padH=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const barsH=$("bars").getBoundingClientRect().height;
  const availW=W-padH-8, availH=Math.max(120,H-padT-padB-barsH-GAP-4);
  const t=Math.min(CELL,availW/MIN_COLS,availH/MIN_ROWS);
  let R=oddNear(availH/t,MIN_ROWS,MAX_ROWS), ch=availH/R, C=oddNear(availW/ch,MIN_COLS,MAX_COLS);
  zoomZ=zoomRings();
  if(zoomZ>0){ const cMin=C+2*zoomZ, rMin=R+2*zoomZ, t2=Math.min(availW/cMin,availH/rMin);   // 🥑 zoom out: more cells, smaller
    R=oddNear(availH/t2,rMin,99); ch=availH/R; C=oddNear(availW/ch,cMin,99); }
  COLS=C; ROWS=R; HC=(C-1)/2; HR=(R-1)/2;
  const cw=Math.min(availW/COLS,ch*1.25);
  $("board").style.width=cw*COLS+"px"; $("board").style.height=availH+"px"; $("board").style.marginTop="4px";
  const r=$("board").getBoundingClientRect(); B={x:r.left,y:r.top,w:r.width,h:r.height,cw,ch,c:Math.min(cw,ch)};
  if(hidden){ ui.classList.add("hidden"); ui.style.visibility=""; }
  placeFog();
  if(state==="play"&&phase==="idle"&&world.size){ prune(); stock(); } }
function placeFog(){ const k=fogRings(), f=[...document.querySelectorAll("#board .fog")], w=B.w, h=B.h, tw=k*B.cw, th=k*B.ch;
  const rects=[[0,0,w,th],[0,h-th,w,th],[0,th,tw,h-2*th],[w-tw,th,tw,h-2*th]];
  f.forEach((d,i)=>{ d.style.display=k?"block":"none"; const [x,y,ww,hh]=rects[i]; Object.assign(d.style,{left:x+"px",top:y+"px",width:ww+"px",height:hh+"px"}); }); }
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2.5); const vv=window.visualViewport; W=Math.round(vv?vv.width:innerWidth)||innerWidth; H=Math.round(vv?vv.height:innerHeight)||innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); layout(); }
addEventListener("orientationchange",()=>setTimeout(resize,250));
if(window.visualViewport) visualViewport.addEventListener("resize",()=>resize());
addEventListener("resize",()=>resize());

// ---------- Audio (always on) ----------
let ac=null; const muted=false; // sound is always on
function initAudio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}} if(ac&&ac.state==="suspended")ac.resume(); }
function tone(fq,dur,type="sine",vol=0.15,to=null,delay=0){ if(muted||!ac)return; const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(fq,t); if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02); }
const sfx={
  jump(far){ tone(300,far?0.3:0.22,"triangle",0.12,far?900:700); },
  land(){ tone(140,0.08,"sine",0.15,90); },
  good(){ tone(660,0.09,"triangle",0.15); tone(990,0.12,"triangle",0.13,null,0.07); },
  bad(){ tone(200,0.3,"square",0.08,90); },
  hurt(){ tone(330,0.18,"square",0.07,160); tone(220,0.25,"square",0.07,110,0.15); },
  toot(){ if(muted||!ac)return; const t=ac.currentTime,d=0.55,o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter();
    o.type="sawtooth"; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(70,t+d); l.frequency.value=28; lg.gain.value=30; l.connect(lg).connect(o.frequency);
    f.type="lowpass"; f.frequency.value=700; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(f).connect(g).connect(ac.destination); o.start(t); l.start(t); o.stop(t+d+0.05); l.stop(t+d+0.05); tone(1200,0.15,"sine",0.06,1800,d); },
  bigFart(){ if(muted||!ac)return; const t=ac.currentTime,d=1.4;
    const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter();
    o.type="sawtooth"; o2.type="square"; o.frequency.setValueAtTime(110,t); o.frequency.linearRampToValueAtTime(150,t+0.35); o.frequency.exponentialRampToValueAtTime(55,t+d);
    o2.frequency.setValueAtTime(57,t); o2.frequency.exponentialRampToValueAtTime(40,t+d);
    l.type="sine"; l.frequency.setValueAtTime(22,t); l.frequency.linearRampToValueAtTime(35,t+d); lg.gain.value=40; l.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    f.type="lowpass"; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(300,t+d); f.Q.value=4;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.05); g.gain.setValueAtTime(0.45,t+d*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+d);

// ---------- Bars (only the bars of this level are visible) ----------
let barEl={};
function buildBars(){ const half=(cls,gl)=>`<div class="half ${cls}">${'<div class="blk"><b></b><s></s></div>'.repeat(4)}${gl?'<div class="gl"></div>':""}</div>`;

    <div class="trk">${b?half("b"):""}${half("g",L.n===1&&g==="pro")}</div></div>`).join("");

  const gl=document.querySelector("#bars .gl"); if(gl) gl.style.left="100%"; }
const EFF={wat:effWat,carb:effCarb,fat:effFat};
function renderBars(){ for(const k in barEl){ const e=barEl[k], v=nut[k]||0, ef=EFF[k]?EFF[k]():v;
    e.blocks.forEach((bl,i)=>{ const q=Math.max(0,Math.min(1,ef-i)), qa=Math.max(0,Math.min(1,v-i)), blk=Math.max(0,qa-q);

    e.half.classList.toggle("alarm",e.bad?v>=3:(k==="wat"&&ef<0.6)); }
  placeFog(); }
function pulse(k){ const e=barEl[k]&&barEl[k].icon; if(!e)return; e.classList.remove("up"); void e.offsetWidth; e.classList.add("up"); }
function drain(){ for(const k of L.nuts) nut[k]=cl(nut[k]-DRAIN[k]); }

// ---------- World ----------
const key=(x,y)=>x+","+y, pick=a=>a[(Math.random()*a.length)|0];
const cheb=(dx,dy)=>Math.max(Math.abs(dx),Math.abs(dy));
const FX=()=>L.flag[0], FY=()=>L.flag[1];
function terrAt(x,y){ if(x===FX()&&y===FY()) return "flag";
  if(L.moat){ const d=cheb(x-FX(),y-FY()); if(d>=1&&d<=L.moat) return "sea"; }
  if(L.desert&&y>=L.desert[0]&&y<=L.desert[1]) return "desert"; return null; }
function tile(x,y){ const k=key(x,y); if(!world.has(k)) world.set(k,{item:null,pop:1,terr:terrAt(x,y)}); return world.get(k); }
function prune(){ for(const k of world.keys()){ const [x,y]=k.split(",").map(Number); if(Math.abs(x-fx)>HC+3||Math.abs(y-fy)>HR+3) world.delete(k); } }
function pathCells(dx,dy){ const o=[], n=cheb(dx,dy); for(let i=1;i<=n;i++){ o.push([fx+Math.round(dx*i/n),fy+Math.round(dy*i/n)]); } return o; }
function legal(dx,dy){ if(state!=="play"||(!dx&&!dy)) return false;
  if(Math.abs(dx)>HC||Math.abs(dy)>HR||cheb(dx,dy)>range()) return false;
  const t=tile(fx+dx,fy+dy); if(t.terr==="sea") return false;
  if(L.n>=2){ if(effWat()<=0.001) return false;
    if(tile(fx,fy).terr!=="desert"&&pathCells(dx,dy).some(([x,y])=>tile(x,y).terr==="desert")&&effWat()<2-1e-6) return false; }  // entering 🏜️ only with 💧💧
  return true; }
// food categories / placement
const inG=(e,g)=>G[g].includes(e);
function genFood(){ let r=Math.random(), tot=L.pool.reduce((s,p)=>s+p[1],0); r*=tot; for(const [g,w] of L.pool){ if(r<w) return pick(G[g]); r-=w; } return pick(G.fill); }
const isBadFood=e=>{ let g=0,b=0; for(const k in F[e]) if(has(k)) (BADK.has(k)?b+=F[e][k]:g+=F[e][k]); return b>g; };
// where a food likes to be: temptations close, water far (🧂 level)
function wantDist(e){ if(L.n===3&&inG(e,"salty")) return [1,2]; if(L.n===3&&inG(e,"wat")) return [3,99];
  if(L.n===4&&inG(e,"fast")) return [1,2]; if(L.n===5&&inG(e,"bfat")) return [1,2]; return [1,99]; }
function viewCells(){ const o=[]; for(let y=-HR;y<=HR;y++)for(let x=-HC;x<=HC;x++){ if(!x&&!y) continue; const t=tile(fx+x,fy+y); if(!t.terr||t.terr==="desert") o.push({x,y,t}); } return o; }
function foodRange(){ const k=Math.max(1,COLS*ROWS/77); return [Math.round(4*Math.sqrt(k)),Math.round(8*Math.sqrt(k))]; }
function stock(){ if(state!=="play") return; const [MINF,MAXF]=foodRange(), cells=viewCells();
  const food=()=>cells.filter(c=>c.t.item), free=()=>cells.filter(c=>!c.t.item);
  const place=(e,dmin=1,dmax=99)=>{ let c=free().filter(c=>{const d=cheb(c.x,c.y);return d>=dmin&&d<=dmax;});
    if(!c.length) c=free().filter(c=>cheb(c.x,c.y)<=dmax); if(!c.length) return false;
    if(food().length>=MAXF){ const bad=food().filter(c=>isBadFood(c.t.item.e)); if(bad.length) pick(bad).t.item=null; else pick(food()).t.item=null; }
    const t=pick(c).t; t.item={e,nu:F[e]}; t.pop=0; return true; };
  while(food().length>MAXF) pick(food()).t.item=null;
  const target=MINF+((Math.random()*(MAXF-MINF+1))|0);
  let guard=0; while(food().length<target&&guard++<40){ const e=genFood(), [a,b]=wantDist(e); place(e,a,b); }
  const R=range(), near=(g,d)=>cells.some(c=>c.t.item&&inG(c.t.item.e,g)&&cheb(c.x,c.y)<=d);
  // fairness: what you NEED is always on the board, and in reach when you run low
  if(L.n===1&&nut.pro<4){ if(!near("pro",R)) place(pick(G.pro),1,R); if(cells.filter(c=>c.t.item&&inG(c.t.item.e,"pro")).length<2) place(pick(G.pro)); }
  if(L.n>=2){ if(!near("wat",99)) place(pick(G.wat),Math.min(3,R),99); if(effWat()<2.3&&!near("wat",R)) place(pick(G.wat),R,R); }
  if(L.n===3&&!near("salty",2)) place(pick(["🍟","🥓","🍕","🥨"]),1,2);
  if(L.n===4){ if(!near("slow",R+2)) place(pick(G.slow),1,R+2); if(!near("fast",2)) place(pick(G.fast),1,2); }
  if(L.n===5){ if(!near("gfat",R)) place(pick(G.gfat),1,R); if(!near("bfat",2)) place(pick(G.bfat),1,2); } }

function flyToBars(item,sx,sy){ let i=0; for(const [k,d] of Object.entries(item.nu)){ if(d<=0||!barEl[k])continue; const tgt=barEl[k].icon.getBoundingClientRect();

    setTimeout(()=>{ el.style.transform=`translate(${tgt.left+tgt.width/2-12}px,${tgt.top+tgt.height/2-12}px) scale(.6)`; el.style.opacity=".25"; },20+delay);
    setTimeout(()=>{ el.remove(); pulse(k); },600+delay); }
  setTimeout(renderBars,520); }
function burst(x,y,cols,n=12,spd=180){ for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(0.4+Math.random()); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0.6+Math.random()*0.3,max:0.9,c:cols[i%cols.length],r:3+Math.random()*4});} }

const PX=()=>B.x+B.w/2, PY=()=>B.y+B.h/2, PR=()=>B.c*0.40*fartyScale();
const fartyScale=()=>0.8+0.12*Math.floor(nut.pro+1e-6);   // 🥚 Farty grows with every full protein block

// ---------- Turn ----------
function tap(dx,dy){
  if(state!=="play"||phase!=="idle"||jump) return false;
  dx|=0; dy|=0; if(!legal(dx,dy)){ if(dx||dy){ sfx.nope(); shake=0.12; } return false; }
  const d=cheb(dx,dy);
  jump={t:0,dur:Math.min(0.8,0.42+d*0.07),dist:d,from:{x:fx,y:fy},to:{x:fx+dx,y:fy+dy}};
  for(let y=-HR-1;y<=HR+1;y++)for(let x=-HC-1;x<=HC+1;x++) tile(jump.to.x+x,jump.to.y+y);
  if(L.n>=2) nut.wat=cl(nut.wat-(0.15+0.1*d));     // 💧 every jump costs water, further = more
  sfx.jump(d>2); player.squish=0.8; phase="jump"; renderBars(); return true; }
function land(){ const j=jump; jump=null; fx=j.to.x; fy=j.to.y; cam={x:fx,y:fy}; player.squish=1; sfx.land(); jumps++;
  const t=tile(fx,fy), item=t.item; t.item=null;
  if(t.terr==="desert") { nut.wat=cl(nut.wat-0.4); floater("🔥",PX()+PR()*1.2,PY()-PR(),"#e65100",22); }
  if(item){ for(const k in item.nu) if(has(k)) nut[k]=cl(nut[k]+item.nu[k]);

    if(isBadFood(item.e)){ sfx.bad(); player.sad=1; burst(PX(),PY(),["#ff7043","#ffb199","#ffd54f"],10); }
    else { sfx.good(); player.mouth=1; burst(PX(),PY(),["#66bb6a","#ffee58","#ffffff","#81d4fa"],12);
      let g=0; for(const k in item.nu) if(has(k)&&!BADK.has(k)) g+=item.nu[k]; const pts=Math.round(g*10);
      if(pts>0){ score+=pts; floater("👍",PX(),PY()-PR()*1.9,"#2e7d32",24); } } }
  else renderBars();
  if(L.n===1&&!unlocked&&nut.pro>=4-1e-6){ unlocked=true; sfx.unlock(); floater("🔓🏁",PX(),PY()-PR()*2.6,"#ff8f00",34); }
  if(t.terr==="flag"&&(L.n>1||unlocked)){ phase="wait"; turns++; renderBars(); setTimeout(startBigFart,450); return; }
  if(t.terr==="flag"){ floater("🔒",PX(),PY()-PR()*2,"#795548",34); sfx.nope(); }
  jumpsLeft--; if(jumpsLeft<=0) endTurn();
  if(zoomRings()!==zoomZ) layout();
  prune(); stock(); renderBars();
  if(L.n>=2&&effWat()<=0.001){ fail(); return; }
  if(crash){ crash=false; phase="sleep"; phaseT=0; sfx.snore(); floater("😴",PX()+PR()*1.1,PY()-PR()*1.3,"#5c6bc0",40); return; }
  phase="idle"; }
function endTurn(){ turns++; const s0=nut.sug; drain();
  if(has("sug")&&hadSugar&&s0>0.001&&nut.sug<=0.001){ crash=true; hadSugar=false; }   // 🍬 sugar crash
  jumpsLeft=jumpsPerTurn(); }
function fail(){ phase="dry"; sfx.dry(); shake=0.4;
  setTimeout(()=>{ $("rres").innerHTML=`<div class="rf">🏜️😵</div><div class="rs">💧0</div><div class="rf" style="font-size:54px">🔁</div>`; $("rres").classList.add("show","tap"); },900); }

function rrect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function drawBoard(now,dt){ const c=B.c, cw=B.cw, ch=B.ch, ox=B.x+B.w/2, oy=B.y+B.h/2;

  const tx=jump?jump.to.x:fx, ty=jump?jump.to.y:fy, showReach=phase==="idle"&&!jump;
  const x0=Math.floor(cam.x)-HC-1, y0=Math.floor(cam.y)-HR-1, pulseA=0.25+0.12*Math.sin(now*0.006);
  cx.textAlign="center"; cx.textBaseline="middle";
  for(let wy=y0;wy<=y0+ROWS+2;wy++) for(let wx=x0;wx<=x0+COLS+2;wx++){
    const sx=ox+(wx-cam.x)*cw, sy=oy+(wy-cam.y)*ch; if(sx<B.x-cw||sx>B.x+B.w+cw||sy<B.y-ch||sy>B.y+B.h+ch) continue;
    const t=tile(wx,wy), isFarty=(wx===fx&&wy===fy&&!jump), isTarget=jump&&wx===tx&&wy===ty;
    const pad=c*0.06, X=sx-cw/2+pad, Y=sy-ch/2+pad, w=cw-2*pad, h=ch-2*pad, rad=c*0.18;
    rrect(cx,X,Y,w,h,rad);
    cx.fillStyle=t.terr==="sea"?"#4fc3f7":t.terr==="desert"?"#f2cf86":isTarget?"#fff59d":isFarty?"#e9dcc9":(wx+wy)%2?"rgba(255,255,255,0.55)":"rgba(255,255,255,0.42)"; cx.fill();
    if(showReach&&!isFarty&&legal(wx-fx,wy-fy)){ cx.fillStyle=`rgba(255,213,79,${pulseA})`; cx.fill(); cx.lineWidth=2; cx.strokeStyle="rgba(255,160,0,.55)"; cx.stroke(); }
    if(isTarget){ cx.lineWidth=3; cx.strokeStyle="#ffb300"; cx.stroke(); }
    if(t.terr==="sea"){ cx.globalAlpha=.75; cx.font=`${c*0.5}px ${EMO}`; cx.fillText("🌊",sx,sy+Math.sin(now*0.003+wx+wy)*c*0.04); cx.globalAlpha=1; }
    else if(t.terr==="desert"&&!t.item){ cx.globalAlpha=.55; cx.font=`${c*0.45}px ${EMO}`; cx.fillText((wx*7+wy*3)%4?"🏜️":"🌵",sx,sy); cx.globalAlpha=1; }
    else if(t.terr==="flag"){ const lock=L.n===1&&!unlocked; cx.fillStyle="#fff"; rrect(cx,X,Y,w,h,rad); cx.fill(); cx.lineWidth=3; cx.strokeStyle=lock?"#9e9e9e":"#ffb300"; cx.stroke();
      cx.globalAlpha=lock?0.45:1; cx.font=`${c*0.7}px ${EMO}`; cx.fillText("🏁",sx,sy+Math.sin(now*0.005)*c*0.04); cx.globalAlpha=1;
      if(lock){ cx.font=`${c*0.36}px ${EMO}`; cx.fillText("🔒",sx+cw*0.26,sy+ch*0.24); } }
    if(t.item){ t.pop=Math.min(1,t.pop+dt*3); const p=t.pop<1?Math.sin(t.pop*Math.PI/2)*(1+0.25*Math.sin(t.pop*Math.PI)):1;
      cx.fillStyle="rgba(255,255,255,0.9)"; rrect(cx,X,Y,w,h,rad); cx.fill();
      if(showReach&&legal(wx-fx,wy-fy)){ cx.lineWidth=2.5; cx.strokeStyle="rgba(255,160,0,.8)"; cx.stroke(); }
      const bob=Math.sin(now*0.003+wx*1.7+wy*2.3)*c*0.02;
      cx.font=`${c*0.62*p}px ${EMO}`; cx.fillText(t.item.e,sx,sy+bob+c*0.03); }
    else if(!t.terr&&!isFarty&&!isTarget){ cx.fillStyle="rgba(95,191,58,0.35)"; for(const [a,b] of [[-.18,.12],[.15,-.1],[.05,.2]]){ cx.beginPath(); cx.arc(sx+a*c,sy+b*c,c*0.035,0,7); cx.fill(); } } }
  // 🏁 off-screen: show it at the edge, pointing the way
  const fdx=FX()-cam.x, fdy=FY()-cam.y;
  if(Math.abs(fdx)>HC+0.4||Math.abs(fdy)>HR+0.4){ const k=Math.min((B.w/2-c*0.5)/Math.max(1e-3,Math.abs(fdx*cw)),(B.h/2-c*0.5)/Math.max(1e-3,Math.abs(fdy*ch)));
    const ex=ox+fdx*cw*k, ey=oy+fdy*ch*k, a=Math.atan2(fdy*ch,fdx*cw);
    cx.save(); cx.globalAlpha=0.85+0.15*Math.sin(now*0.008); cx.fillStyle="rgba(255,255,255,.9)"; cx.beginPath(); cx.arc(ex,ey,c*0.42,0,7); cx.fill();
    cx.lineWidth=3; cx.strokeStyle="#ffb300"; cx.stroke();
    cx.font=`${c*0.46}px ${EMO}`; cx.fillText("🏁",ex,ey);
    cx.translate(ex,ey); cx.rotate(a); cx.fillStyle="#ff8f00"; cx.beginPath(); cx.moveTo(c*0.62,0); cx.lineTo(c*0.44,-c*0.14); cx.lineTo(c*0.44,c*0.14); cx.fill(); cx.restore(); }
  cx.restore(); }

// Farty = a cute little brown fart cloud (prootje)
// cloud shape: [x,y,rx,ry] in units of r; wide puffy top, flat-ish bottom, little trailing puffs = a fart cloud
const PUFFS=[[0,0.2,1.18,0.46],[-0.55,-0.14,0.44,0.44],[0.08,-0.26,0.48,0.48],[0.66,-0.1,0.4,0.4],[1.05,0.16,0.3,0.3],[-1.05,0.14,0.32,0.32]];
const TAIL=[[-1.42,0.46,0.2],[-1.7,0.62,0.13],[-1.9,0.72,0.08]];
function drawFartyAt(g,x,y,r,m,p,t,lift){
  const sq=p.squish*0.18*(lift>0?-1:1), wob=Math.sin(t*0.004)*0.03;
  const body=m==="dry"?"#b0a8a0":p.sad>0.3?"#dba878":(m==="sick"||m==="dry")?"#b1b06a":m==="healthy"?"#c79c78":"#bd926f", rim=(m==="sick"||m==="dry")?"#76823a":"#7a5643";
  g.save(); g.translate(x,y); g.scale(1+sq,1-sq);
  // whoosh lines behind the tail
  g.strokeStyle=(m==="sick"||m==="dry")?"rgba(124,179,66,0.75)":"rgba(109,76,61,0.45)"; g.lineWidth=Math.max(2,r*0.07); g.lineCap="round";
  for(let i=0;i<3;i++){ const yy=r*(0.05+i*0.28), sh=Math.sin(t*0.008+i)*r*0.08; g.beginPath(); g.moveTo(-r*(1.55+i*0.12)+sh,yy-r*0.1); g.quadraticCurveTo(-r*(1.9+i*0.1)+sh,yy-r*0.25,-r*(2.2+i*0.08)+sh,yy-r*0.05); g.stroke(); }
  if(p.tootT>0||m==="healthy"){ g.shadowColor=p.tootT>0?"rgba(140,220,60,0.9)":"rgba(255,215,64,0.9)"; g.shadowBlur=18; }
  const blob=(pad,col)=>{ g.fillStyle=col; for(const [a,b,rx,ry] of PUFFS){ g.beginPath(); g.ellipse(a*r,b*r,(rx+wob)*r+pad,(ry+wob)*r+pad,0,0,7); g.fill(); }
    TAIL.forEach(([a,b,s0],i)=>{ g.beginPath(); g.arc(a*r+Math.sin(t*0.006+i)*r*0.05,b*r,s0*r+pad,0,7); g.fill(); }); };
  blob(r*0.08,rim); g.shadowBlur=0; blob(0,body);
  g.fillStyle="rgba(255,255,255,0.25)"; g.beginPath(); g.ellipse(-r*0.25,-r*0.55,r*0.3,r*0.13,-0.3,0,7); g.fill(); g.beginPath(); g.ellipse(r*0.5,-r*0.4,r*0.14,r*0.08,-0.3,0,7); g.fill();
  // stink squiggles on the side
  g.strokeStyle=(m==="sick"||m==="dry")?"rgba(124,179,66,0.85)":"rgba(140,190,80,0.7)"; g.lineWidth=Math.max(1.5,r*0.06);
  for(const [bx,by] of [[r*1.25,-r*0.45],[r*1.45,-r*0.1]]){ g.beginPath(); for(let k=0;k<=8;k++){ const yy=by-k*r*0.05, xx=bx+Math.sin(k*1.1+t*0.007)*r*0.07; k?g.lineTo(xx,yy):g.moveTo(xx,yy);} g.stroke(); }
  const fy=r*0.08, blink=(Math.sin(t*0.0013)>0.985)?0.15:1; g.fillStyle="#2b1d16";
  if((m==="sick"||m==="dry")){ g.strokeStyle="#2b1d16"; g.lineWidth=r*0.07; for(const s of [-1,1]){ g.beginPath(); g.moveTo(s*r*0.42,fy-r*0.1); g.lineTo(s*r*0.24,fy); g.lineTo(s*r*0.42,fy+r*0.08); g.stroke(); } }
  else { for(const s of [-1,1]){ g.beginPath(); g.ellipse(s*r*0.3,fy,r*0.11,r*0.15*blink,0,0,7); g.fill(); }
    g.fillStyle="#fff"; for(const s of [-1,1]){ g.beginPath(); g.arc(s*r*0.3+r*0.04,fy-r*0.06,r*0.045,0,7); g.fill(); } }
  if(m!=="sick"){ g.fillStyle="rgba(255,130,150,0.6)"; for(const s of [-1,1]){ g.beginPath(); g.ellipse(s*r*0.6,fy+r*0.22,r*0.13,r*0.07,0,0,7); g.fill(); } }
  g.fillStyle="#5a1f2a"; g.strokeStyle="#5a1f2a"; g.lineWidth=r*0.07;
  if(p.sad>0.3){ g.beginPath(); g.arc(0,fy+r*0.48,r*0.17,Math.PI*1.15,Math.PI*1.85); g.stroke(); }
  else if((m==="sick"||m==="dry")){ g.beginPath(); for(let i=0;i<=8;i++){ const xx=-r*0.24+i*r*0.06, yy=fy+r*0.34+(i%2?-1:1)*r*0.04; i?g.lineTo(xx,yy):g.moveTo(xx,yy);} g.stroke(); }
  else { const mo=0.09+p.mouth*0.15+(m==="healthy"?0.04:0)+(lift>0?0.1:0); g.beginPath(); g.ellipse(0,fy+r*0.26,r*0.19,r*mo,0,0,Math.PI); g.fill(); }
  g.restore(); }

function fartyMood(){ if(state!=="play") return "ok"; if(phase==="dry"||(L.n>=2&&effWat()<=0.001)) return "dry";
  if(L.n>=3&&(nut.salt>=3||(nut.sat||0)>=3)) return "sick"; if(L.n>=2&&effWat()<0.6) return "ok"; if(phase==="fart"||phase==="result") return "healthy";
  return nut.pro>=3?"healthy":"ok"; }
function drawFarty(t){ const m=fartyMood(); let r=PR()*(m==="dry"?0.7:1), x=PX(), y=PY()+r*0.05, lift=0;
  if(jump){ const k=Math.min(1,jump.t/jump.dur); lift=Math.sin(Math.PI*k)*B.ch*(0.8+Math.min(jump.dist,4)*0.12); }
  cx.save(); cx.fillStyle="rgba(0,0,0,0.18)"; cx.beginPath(); cx.ellipse(x,y+r*0.95,r*(0.95-lift/B.c*0.25),r*0.2,0,0,7); cx.fill(); cx.restore();
  drawFartyAt(cx,x,y-lift,r,m,player,t,lift);
  if(m==="dry"){ cx.save(); cx.strokeStyle="#6d6d6d"; cx.lineWidth=Math.max(1.5,r*0.06); for(const [a,b,s] of [[-.6,-.3,1],[.3,-.45,-1],[.7,.2,1]]){ cx.beginPath(); cx.moveTo(x+a*r,y+b*r); cx.lineTo(x+(a+.12*s)*r,y+(b+.15)*r); cx.lineTo(x+(a-.02*s)*r,y+(b+.28)*r); cx.lineTo(x+(a+.1*s)*r,y+(b+.42)*r); cx.stroke(); } cx.restore(); }
  cx.textAlign="center"; cx.textBaseline="middle";
  if(phase==="sleep"){ cx.font=`${r*0.7}px ${EMO}`; cx.fillText("😴",x+r*1.2,y-r*1.1+Math.sin(t*0.004)*4); cx.font=`bold ${r*0.5}px sans-serif`; cx.fillStyle="#5c6bc0"; cx.fillText("z",x+r*1.7,y-r*1.7-((t*0.05)%20)); }
  else if(m==="sick"&&!jump){ cx.font=`${r*0.6}px ${EMO}`; cx.fillText("🤢",x+r*1.2,y-r*1.05); }
  // ⚡ extra jumps this turn (🌾 level and up)
  if(has("carb")&&phase==="idle"&&!jump&&jumpsLeft>1){ cx.font=`${Math.max(12,r*0.45)}px ${EMO}`; const n=jumpsLeft-1; for(let i=0;i<n;i++) cx.fillText("⚡",x+(i-(n-1)/2)*r*0.5,y-r*1.45+Math.sin(t*0.006+i)*2); } }
const sf=$("startFarty").getContext("2d"), ff=$("finalFarty").getContext("2d");

// ---------- Loop ----------
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function step(now){ requestAnimationFrame(step); let dt=Math.min(0.05,(now-last)/1000); last=now; if(!(dt>0)) dt=0.016;
  if(state!=="play"){ drawBg(dt); const g=state==="final"?ff:sf; g.clearRect(0,0,240,200); drawFartyAt(g,140,112,52,"healthy",{squish:0,sad:0,tootT:0,mouth:0.6},now,0); return; }
  if(jump){ jump.t+=dt; const k=Math.min(1,jump.t/jump.dur), e=ease(k); cam={x:jump.from.x+(jump.to.x-jump.from.x)*e,y:jump.from.y+(jump.to.y-jump.from.y)*e}; if(k>=1) land(); }
  if(phase==="fart"||phase==="result"||phase==="sleep") phaseUpdate(dt);
  player.squish=Math.max(0,player.squish-dt*4); player.mouth=Math.max(0,player.mouth-dt*2.5); player.sad=Math.max(0,player.sad-dt*1.2);
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.cloud){p.vx*=0.97;p.vy*=0.95;p.r+=dt*14;} else p.vy+=400*dt; }
  for(let i=floaters.length-1;i>=0;i--){ const fl=floaters[i]; fl.life-=dt*0.9; fl.y-=45*dt; if(fl.life<=0) floaters.splice(i,1); }
  cx.save(); if(shake>0){ shake-=dt; const a=Math.min(shake,1.2)*28; cx.translate((Math.random()-.5)*a,(Math.random()-.5)*a); }
  drawBg(dt); drawBoard(now,dt);
  for(const p of parts){ cx.globalAlpha=Math.max(0,p.life/p.max); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); } cx.globalAlpha=1;
  if(phase==="fart") drawBigFart();
  drawFarty(now);
  cx.textAlign="center"; cx.textBaseline="middle";
  for(const fl of floaters){ cx.globalAlpha=Math.max(0,fl.life); cx.font=`bold ${fl.size}px "Trebuchet MS",${EMO}`; cx.lineWidth=5; cx.strokeStyle="#fff"; cx.strokeText(fl.text,fl.x,fl.y); cx.fillStyle=fl.color; cx.fillText(fl.text,fl.x,fl.y); }
  cx.globalAlpha=1; cx.restore(); }

// ---------- Test hooks ----------
window.__farty={version:"4",tap,legal,startLevel,showInfo,
  get state(){return state;},get phase(){return phase;},get level(){return L.n;},get turns(){return turns;},get jumps(){return jumps;},get cols(){return COLS;},get rows(){return ROWS;},
  get nut(){return {...nut};},setNut(k,v){nut[k]=v;},get range(){return range();},get unlocked(){return unlocked;},get jumpsLeft(){return jumpsLeft;},get stars(){return [...stars];},
  get eff(){return {wat:effWat(),carb:effCarb(),fat:effFat(),zoom:zoomZ,fog:fogRings()};},
  view(){ const o=[]; for(let y=-HR;y<=HR;y++)for(let x=-HC;x<=HC;x++){ if(!x&&!y)continue; const t=tile(fx+x,fy+y); o.push({x,y,e:t.item?t.item.e:null,terr:t.terr,ok:legal(x,y),bad:t.item?isBadFood(t.item.e):null}); }
    return {flag:{dx:FX()-fx,dy:FY()-fy},cells:o}; }};
resize();
const lt=Math.max(1,Math.min(LV.length,+Q.get("lt")||1));
if(Q.get("autostart")==="1") startLevel(lt); else if(Q.get("lt")) showInfo(lt); else showStart();
requestAnimationFrame(t=>{ last=t; step(t); });
})();
</script>
